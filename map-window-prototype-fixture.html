<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lead Map Window Prototype</title>
<style>body{margin:0;font:14px system-ui;background:#f3f4f6;color:#111827}.card{background:#fff;border-radius:14px;padding:12px}.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:12px}.map-surface{height:520px;background:linear-gradient(25deg,#d8e8d1,#dce7ef);position:relative;overflow:hidden}.map-surface:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(40deg,transparent 0 65px,rgba(255,255,255,.7) 66px 74px)}button{border:1px solid #b8c0cc;border-radius:9px;padding:9px;font-weight:800}.primary{background:#1455d9;color:#fff}.assign-btn{background:#fff;color:#111827}.mock-pin{position:absolute;left:55%;top:42%;z-index:10;width:44px;height:44px;border-radius:50%;background:#1455d9;color:#fff}.muted{color:#667085}.small{font-size:12px}.map-pin-disposition{display:grid;gap:10px}.map-pin-disposition-grid{display:grid;gap:8px}.map-pin-disposition-grid label{display:grid;gap:4px}.map-pin-disposition-grid select{min-height:44px}.map-pin-disposition-actions{display:grid;gap:7px}#leadCorrectionPanel{display:block}</style></head>
<body><button data-view="leads">Lead Pool</button><div id="leadMapPanel"><div class="grid-2"><div class="card"><div id="realLeadMapHeader"><strong>Real Lead Map</strong></div><div id="leadGeoControls">Map tools</div><div id="leadMapFrame" class="map-surface"><button id="mockLeadPin" class="mock-pin" aria-label="Select 123 Main Street">PIN</button></div></div><div class="card"><div id="mapLeadDetail"><div class="map-pin-disposition"><strong>Disposition</strong><div class="map-pin-disposition-grid"><label>Visit Result<select><option>No Answer</option><option>Contacted</option></select></label></div><div class="map-pin-disposition-actions"><button class="primary">SAVE PIN DISPOSITION</button></div></div></div><div id="leadCorrectionPanel"><strong>Correct Lead</strong><button id="moveLeadPinBtn" class="primary">MOVE PIN</button><button id="cancelLeadPinBtn" class="assign-btn">CANCEL</button></div></div></div></div>
<script>var state={realLeads:[{id:'lead-1',dbId:'lead-1',address:'123 Main Street',city:'Battle Ground',stateCode:'WA',zip:'98604',assignedRepId:'rep-1'}]};window.MCCOY_ACCESS={user:{id:'rep-1'},access:{role:'rep'}};window.MCCOY_LEAD_MAP={invalidateSize(){}};window.L={DomEvent:{disableClickPropagation(){}}};document.getElementById('mockLeadPin').onclick=()=>window.dispatchEvent(new CustomEvent('mccoy-map-lead-selected',{detail:{leadId:'lead-1'}}));document.getElementById('moveLeadPinBtn').onclick=()=>{window.MCCOY_MAP_MOVE_PIN_ACTIVE=true;window.dispatchEvent(new CustomEvent('mccoy-map-move-pin-started',{detail:{leadId:'lead-1'}}))};document.getElementById('cancelLeadPinBtn').onclick=()=>{window.MCCOY_MAP_MOVE_PIN_ACTIVE=false;window.dispatchEvent(new CustomEvent('mccoy-map-move-pin-ended',{detail:{leadId:'lead-1'}}))}</script>
<script src="app-lead-map-window-controls.js"></script></body></html>
