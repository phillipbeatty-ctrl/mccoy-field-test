<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McCoy — Read-only Address Validation Pilot</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fa}
    body{margin:0;padding:24px}.shell{max-width:1500px;margin:auto}.card{background:#fff;border:1px solid #d8e0ea;border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
    h1{margin:0 0 6px;font-size:22px}.muted{color:#64748b}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
    button{border:0;border-radius:8px;background:#0f5fb4;color:#fff;font-weight:700;padding:10px 14px;cursor:pointer}button:disabled{cursor:wait;opacity:.6}
    #status[data-tone="error"]{color:#b91c1c}#status[data-tone="ok"]{color:#166534}.summary{margin:12px 0;font-size:14px}
    .table-wrap{max-height:68vh;overflow:auto;border:1px solid #d8e0ea}table{width:max-content;min-width:100%;border-collapse:collapse;font-size:11px}th,td{padding:6px;border:1px solid #d8e0ea;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#e8eef6;z-index:1}
    details{margin-top:12px}pre{max-height:320px;overflow:auto;background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;font-size:10px;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>100-lead Address Validation pilot</h1>
      <p class="muted">Admin-only comparison of existing Lead Pool pins with Google Address Validation. This page cannot change lead records.</p>
      <div class="actions">
        <button id="runPilot" disabled>CHECKING ADMIN ACCESS…</button>
        <span id="status">Checking the signed-in McCoy session…</span>
      </div>
      <div id="results" hidden>
        <div id="summary" class="summary"></div>
        <div class="table-wrap">
          <table aria-label="100-lead Address Validation pilot comparison">
            <thead><tr id="head"></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
        <details><summary>Raw JSON comparison</summary><pre id="raw"></pre></details>
      </div>
    </section>
  </main>
  <script src="address-validation-pilot-standalone.js?v=2026082501"></script>
</body>
</html>
