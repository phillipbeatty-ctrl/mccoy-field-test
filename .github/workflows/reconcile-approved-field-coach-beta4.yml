name: Reconcile and finalize approved Field Coach beta 4

on:
  workflow_dispatch:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.github/workflows/reconcile-approved-field-coach-beta4.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: finalize-approved-field-coach-beta4
  cancel-in-progress: true

jobs:
  reconcile-validate-promote-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BRANCH: fix/approved-official-logo-beta4-20260901
      APP_VERSION: 1.0.0-beta.4
      EXPECTED_JPEG_SHA256: 227203e1c0ab14a1aa400e6f0d1411a6512222a685589df92dac3f3c1633cd90
      EXPECTED_PNG_SHA256: ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned verification dependency with system Python
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Detect an already promoted main branch
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main "$BRANCH"
          promoted='false'
          if test "$(git show origin/main:VERSION 2>/dev/null || true)" = '1.0.0-beta.4+4' \
            && test "$(git show origin/main:assets/brand/approved-upload-original.jpg 2>/dev/null | sha256sum | awk '{print $1}')" = "$EXPECTED_JPEG_SHA256" \
            && test "$(git show origin/main:assets/brand/official-logo-source.png 2>/dev/null | sha256sum | awk '{print $1}')" = "$EXPECTED_PNG_SHA256"; then
            promoted='true'
          fi
          echo "promoted=$promoted" >> "$GITHUB_OUTPUT"
          echo "Main already promoted: $promoted"

      - name: Wait for final beta 4 Android evidence
        if: steps.state.outputs.promoted != 'true'
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          validated_run_sha=''
          target=''
          for attempt in $(seq 1 300); do
            git fetch --quiet origin "$BRANCH"
            candidate="$(git rev-parse "origin/$BRANCH")"
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&event=push&per_page=100")"
            while read -r run_sha; do
              test -n "$run_sha" || continue
              if git merge-base --is-ancestor "$run_sha" "$candidate" 2>/dev/null \
                && git cat-file -e "$run_sha:assets/brand/beta4-release-trigger-3.txt" 2>/dev/null \
                && git show "$run_sha:.github/workflows/field-coach-android-internal.yml" 2>/dev/null | grep -Fq 'APP_VERSION: 1.0.0-beta.4'; then
                validated_run_sha="$run_sha"
                break
              fi
            done < <(jq -r '.workflow_runs[] | select(.name=="Field Coach Android Internal Beta" and .status=="completed" and .conclusion=="success") | .head_sha' <<<"$runs")

            if test -n "$validated_run_sha" \
              && git cat-file -e "$candidate:downloads/Field-Coach-Android-${APP_VERSION}-debug.apk" 2>/dev/null \
              && git cat-file -e "$candidate:downloads/Field-Coach-Android-${APP_VERSION}-debug.apk.sha256" 2>/dev/null \
              && git cat-file -e "$candidate:assets/brand/official-logo-source.png" 2>/dev/null; then
              target="$candidate"
              break
            fi
            echo "Waiting for final Android evidence (${attempt}/300)."
            sleep 10
          done
          test -n "$validated_run_sha"
          test -n "$target"
          echo "android_sha=$validated_run_sha" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Validate final branch contents independently
        if: steps.state.outputs.promoted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach '${{ steps.evidence.outputs.target }}'
          python3 scripts/verify-approved-logo-source.py
          python3 scripts/apply-field-coach-icon-links.py
          git diff --exit-code -- '*.html'
          python3 scripts/generate-field-coach-icons.py
          git diff --exit-code -- assets/favicon-64.png \
            assets/apple-touch-icon-180.png \
            assets/icon-192.png \
            assets/icon-512.png \
            assets/icon-maskable-512.png \
            assets/icon-only.png \
            assets/icon-foreground.png \
            assets/icon-background.png \
            assets/splash.png
          node scripts/verify-png-content.mjs \
            assets/favicon-64.png \
            assets/apple-touch-icon-180.png \
            assets/icon-192.png \
            assets/icon-512.png \
            assets/icon-maskable-512.png \
            assets/icon-only.png \
            assets/icon-foreground.png
          if grep -nH '/assets/logo\.svg' ./*.html ./*.js; then
            echo 'A runtime surface still references the deprecated vector source.' >&2
            exit 1
          fi
          grep -Fq '/assets/brand/official-logo-source.png' index.html
          grep -Fq '/assets/brand/official-logo-source.png' app-product-brand.js
          grep -Fq 'field-coach-app-shell-v5-20260901-beta4-approved-logo' service-worker.js
          test "$(cat VERSION)" = '1.0.0-beta.4+4'
          test "$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" = "$APP_VERSION"
          sha256sum -c "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk.sha256"
          node --test \
            mobile-release.test.mjs \
            webapp-download.test.mjs \
            app-update-recovery.test.mjs \
            webapp-csp-install.test.mjs

      - name: Remove one-time release scaffolding before promotion
        if: steps.state.outputs.promoted != 'true'
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH" '${{ steps.evidence.outputs.target }}'
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git rm -f --ignore-unmatch \
            .github/approved-logo-beta4-pr.md \
            .github/workflows/materialize-approved-field-coach-logo.yml \
            .github/workflows/materialize-approved-field-coach-logo-v2.yml \
            .github/workflows/materialize-approved-field-coach-logo-v3.yml \
            .github/workflows/finalize-approved-field-coach-beta4.yml \
            .github/workflows/finalize-approved-field-coach-beta4-v2.yml \
            .github/workflows/reconcile-approved-field-coach-beta4.yml \
            assets/brand/beta4-release-trigger.txt \
            assets/brand/beta4-release-trigger-2.txt \
            assets/brand/beta4-release-trigger-3.txt \
            docs/releases/field-coach-beta4-approval-gate.md \
            docs/releases/field-coach-beta4-ci-gate.md \
            docs/releases/field-coach-beta4-final-head-rule.md \
            docs/releases/field-coach-beta4-logo-surface-map.md \
            docs/releases/field-coach-beta4-merge-gate.md \
            docs/releases/field-coach-beta4-no-data-change.md \
            docs/releases/field-coach-beta4-operator-note.md \
            docs/releases/field-coach-beta4-readme.md \
            docs/releases/field-coach-beta4-status.md \
            docs/releases/field-coach-beta4-verification-plan.md
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-time beta 4 release scaffolding [beta4-final-cleanup]'
            git push origin HEAD:"$BRANCH"
          fi
          target="$(git rev-parse HEAD)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Require Vercel preview on the cleaned exact head
        if: steps.state.outputs.promoted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.cleanup.outputs.target }}'
          for attempt in $(seq 1 150); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}/status")"
            state="$(jq -r '[.statuses[] | select(.context=="Vercel")][0].state // "pending"' <<<"$status")"
            if test "$state" = 'success'; then
              echo 'Vercel preview is ready on the cleaned exact head.'
              exit 0
            fi
            if test "$state" = 'failure' || test "$state" = 'error'; then
              echo "Vercel preview failed with state: $state" >&2
              exit 1
            fi
            echo "Waiting for cleaned-head Vercel preview (${attempt}/150): $state"
            sleep 10
          done
          exit 1

      - name: Open or reuse the correction pull request and merge only the cleaned head
        if: steps.state.outputs.promoted != 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.cleanup.outputs.target }}'
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --limit 1 --jq '.[0].number // empty')"
          if test -z "$pr_number"; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --base main \
              --title 'Lock the approved Field Coach logo and publish Android beta 4' \
              --body-file docs/releases/field-coach-beta4-approved-logo.md
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --limit 1 --jq '.[0].number')"
          fi
          pr_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$pr_head" = "$target"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$target"
          gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body "Approved-logo beta 4 passed exact source checks, decoded-pixel equality, deterministic derivative checks, runtime-reference checks, repository tests, Android APK checksum, successful final-trigger Android CI, and Vercel preview on \`$target\`."
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$target" \
            --subject 'Lock approved Field Coach logo and publish Android beta 4' \
            --body 'Use the exact owner-approved upload as the immutable Field Coach logo source, publish deterministic browser/PWA/native derivatives, and advance the controlled Android build to 1.0.0-beta.4.'
          merge_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge_sha"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Check out promoted main for production comparison
        if: steps.state.outputs.promoted == 'true'
        run: |
          git fetch --quiet origin main
          git checkout --detach origin/main
          python3 scripts/verify-approved-logo-source.py

      - name: Confirm production serves the exact approved beta 4 assets
        shell: bash
        run: |
          set -euo pipefail
          production='https://www.mccoyplatform.com'
          mkdir -p /tmp/field-coach-production
          for attempt in $(seq 1 150); do
            ready='true'
            nonce="${RANDOM}-${attempt}"
            curl -fsSL --retry 2 "$production/assets/brand/official-logo-source.png?beta4=$nonce" -o /tmp/field-coach-production/official-logo-source.png || ready='false'
            curl -fsSL --retry 2 "$production/assets/icon-512.png?beta4=$nonce" -o /tmp/field-coach-production/icon-512.png || ready='false'
            curl -fsSL --retry 2 "$production/assets/icon-maskable-512.png?beta4=$nonce" -o /tmp/field-coach-production/icon-maskable-512.png || ready='false'
            curl -fsSL --retry 2 "$production/service-worker.js?beta4=$nonce" -o /tmp/field-coach-production/service-worker.js || ready='false'
            curl -fsSL --retry 2 "$production/download.html?beta4=$nonce" -o /tmp/field-coach-production/download.html || ready='false'
            if test "$ready" = 'true' \
              && cmp -s assets/brand/official-logo-source.png /tmp/field-coach-production/official-logo-source.png \
              && cmp -s assets/icon-512.png /tmp/field-coach-production/icon-512.png \
              && cmp -s assets/icon-maskable-512.png /tmp/field-coach-production/icon-maskable-512.png \
              && grep -Fq 'field-coach-app-shell-v5-20260901-beta4-approved-logo' /tmp/field-coach-production/service-worker.js \
              && grep -Fq 'Field-Coach-Android-1.0.0-beta.4-debug.apk' /tmp/field-coach-production/download.html; then
              echo 'Production serves the exact approved source, matching derivatives, beta 4 app shell, and beta 4 Android download link.'
              if test '${{ steps.state.outputs.promoted }}' != 'true'; then
                gh pr comment '${{ steps.merge.outputs.pr }}' --repo "$GITHUB_REPOSITORY" --body "Production verification passed for merge \`${{ steps.merge.outputs.sha }}\`: approved source and key derivatives match byte-for-byte, the beta 4 service-worker identity is live, and the beta 4 Android download link is published."
              fi
              exit 0
            fi
            echo "Waiting for production beta 4 propagation (${attempt}/150)."
            sleep 10
          done
          echo 'Production did not converge to the validated beta 4 assets within the verification window.' >&2
          exit 1
