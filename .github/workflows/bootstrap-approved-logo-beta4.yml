name: Recover exact approved Field Coach logo source

on:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-approved-logo-beta4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-logo-source-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-approved-logo:
    if: ${{ !contains(github.event.head_commit.message || '', '[approved-logo-source-recovered]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/approved-official-logo-beta4-20260901

      - name: Salvage the staged JPEG and apply the audited one-byte repair
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'mccoy-logo-beta4-patch.b64.part*' | sort)
          test "${#parts[@]}" -eq 20
          for index in $(seq -w 0 18); do
            test "$(wc -c < ".bootstrap/mccoy-logo-beta4-patch.b64.part${index}")" -eq 8000
          done
          test "$(wc -c < .bootstrap/mccoy-logo-beta4-patch.b64.part19)" -eq 7828
          cat "${parts[@]}" | base64 --decode > /tmp/staged-logo-patch.tar.gz

          set +e
          gzip -dc /tmp/staged-logo-patch.tar.gz > /tmp/staged-logo-patch.tar
          gzip_status=$?
          set -e
          echo "gzip salvage status: ${gzip_status}"
          test -s /tmp/staged-logo-patch.tar

          mkdir -p /tmp/recovered-approved-logo
          set +e
          tar --ignore-zeros -xf /tmp/staged-logo-patch.tar \
            -C /tmp/recovered-approved-logo \
            --wildcards './assets/brand/source-staging/official-logo-source-original.jpg.b64.part*' \
            2>/tmp/recovered-extract-errors.txt
          extract_status=$?
          set -e
          echo "tar extraction status: ${extract_status}"
          cat /tmp/recovered-extract-errors.txt || true

          mapfile -t source_parts < <(find /tmp/recovered-approved-logo -type f -name 'official-logo-source-original.jpg.b64.part*' | sort)
          test "${#source_parts[@]}" -eq 7
          for part in "${source_parts[@]}"; do test -s "$part"; done
          cat "${source_parts[@]}" | base64 --decode > /tmp/recovered-approved-upload-original.jpg
          test "$(wc -c < /tmp/recovered-approved-upload-original.jpg)" -eq 96796
          echo 'ce74f55cc14bea0c1aed4e490dd20f4890ad06af546f70491ed7fb0d5b1b598a  /tmp/recovered-approved-upload-original.jpg' | sha256sum -c -

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('/tmp/recovered-approved-upload-original.jpg')
          data = bytearray(source.read_bytes())
          offset = 82130
          if len(data) != 96796:
              raise SystemExit(f'Unexpected staged JPEG length: {len(data)}')
          if data[offset] != 0x28:
              raise SystemExit(
                  f'Unexpected staged JPEG byte at {offset}: 0x{data[offset]:02x}'
              )
          data[offset] = 0xA8
          source.write_bytes(data)
          actual = sha256(data).hexdigest()
          expected = '227203e1c0ab14a1aa400e6f0d1411a6512222a685589df92dac3f3c1633cd90'
          if actual != expected:
              raise SystemExit(f'Repaired JPEG checksum mismatch: {actual}')
          print({
              'repair_offset': offset,
              'old_byte': '0x28',
              'new_byte': '0xA8',
              'approved_jpeg_sha256': actual,
          })
          PY

      - name: Materialize and verify the immutable approved PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          mkdir -p assets/brand

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image

          original = Path('/tmp/recovered-approved-upload-original.jpg')
          target = Path('assets/brand/official-logo-source.png')
          expected_file = 'ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5'
          expected_pixels = 'a07761316ddcbf77af92a7d6abbb2393ab1cde6ef251d0d39731788535a0279e'

          with Image.open(original) as image:
              image.load()
              rgb = image.convert('RGB')
              if rgb.size != (1024, 1024):
                  raise SystemExit(f'Unexpected approved logo dimensions: {rgb.size}')
              if sha256(rgb.tobytes()).hexdigest() != expected_pixels:
                  raise SystemExit('Approved JPEG decoded pixels do not match the locked source')
              rgb.save(target, format='PNG', optimize=True, compress_level=9)

          actual = sha256(target.read_bytes()).hexdigest()
          if actual != expected_file:
              raise SystemExit(f'Approved PNG checksum mismatch: {actual}')

          target.with_suffix('.sha256').write_text(
              f'{expected_file}  assets/brand/official-logo-source.png\n',
              encoding='utf-8',
          )
          print({
              'authoritative_source': str(target),
              'sha256': actual,
              'pixel_sha256': expected_pixels,
              'dimensions': [1024, 1024],
          })
          PY

          python3 scripts/verify-approved-logo-source.py
          python3 scripts/generate-field-coach-icons.py
          node scripts/verify-png-content.mjs \
            assets/favicon-64.png \
            assets/apple-touch-icon-180.png \
            assets/icon-192.png \
            assets/icon-512.png \
            assets/icon-maskable-512.png \
            assets/icon-only.png \
            assets/icon-foreground.png

      - name: Remove temporary transports and commit the verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -rf .release-asset-transport
          rm -rf assets/brand/source-staging
          rm -f assets/brand/approved-upload-original.jpg
          rm -f .github/workflows/bootstrap-approved-logo-beta4.yml
          rm -f .github/workflows/bootstrap-approved-logo-beta4-v2.yml
          rm -f .github/workflows/diagnose-logo-transport.yml
          rm -f .github/workflows/materialize-approved-field-coach-logo-v4.yml
          rm -f .github/workflows/export-corrupt-approved-logo-for-diff.yml

          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No recovered source changes found.' >&2; exit 1; }
          git commit -m 'Commit checksum-locked approved logo source [approved-logo-source-recovered]'
          git push origin HEAD:fix/approved-official-logo-beta4-20260901
