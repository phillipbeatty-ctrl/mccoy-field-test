name: Admin daily session metrics

on:
  push:
    branches:
      - feature/admin-daily-session-metrics-20260829
  pull_request:
    paths:
      - app-admin-session-history.js
      - app-page-layout.js
      - admin-daily-session-metrics.test.mjs
      - supabase/functions/admin-session-history/index.ts
      - supabase/migrations/20260829000000_admin_daily_session_metrics_indexes.sql
      - .github/workflows/admin-daily-session-metrics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node --check app-admin-session-history.js
      - run: node --check app-page-layout.js
      - run: deno check --node-modules-dir=auto supabase/functions/admin-session-history/index.ts
      - run: node --test admin-daily-session-metrics.test.mjs
