name: Gate Live Feed preview loader once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/scripts/gate-live-feed-preview-loader.py
      - .github/workflows/gate-live-feed-preview-loader-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and verify explicit preview gate
        shell: bash
        env:
          SUPABASE_CLI_VERSION: 2.116.0
        run: |
          set -euo pipefail
          python3 .github/scripts/gate-live-feed-preview-loader.py
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          npm run test:live-feed:local:contract -- --test-reporter=spec
          node --test --test-reporter=spec sale-completion-runtime.test.mjs
          node --test --test-reporter=spec customer-list-stable-actions.test.mjs
          node --test --test-reporter=spec organization-access-gate.test.mjs
          node --test --test-reporter=spec app-update-recovery.test.mjs
          bash scripts/test-live-feed-local.sh
          git diff --check

      - name: Commit verified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-live-wins.js live-feed-comments-contract.test.mjs docs/live-feed-comments-preview.md docs/live-feed-free-test-plan.md
          git diff --cached --check
          git commit -m 'Gate Live Feed client behind explicit preview flag'
          git push origin HEAD:preview/live-feed-comments-20260903
