name: Repair onboarding Edge TypeScript checks once

on:
  push:
    branches:
      - fix/atomic-onboarding-membership-20260902
    paths:
      - .github/workflows/repair-pending-access-tscheck-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out onboarding branch
        uses: actions/checkout@v4
        with:
          ref: fix/atomic-onboarding-membership-20260902
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply only the proven TypeScript narrowing repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              if after in text:
                  return text
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source marker, found {count}")
              return text.replace(before, after, 1)

          pending_path = Path('supabase/functions/pending-account-access/index.ts')
          pending = pending_path.read_text()
          pending = replace_once(
              pending,
              "import { serveWithOrganizationAccess } from '../_shared/organization-paywall.ts'\n// @ts-nocheck\nimport { createClient } from 'npm:@supabase/supabase-js@2.95.0'",
              "// @ts-nocheck\nimport { serveWithOrganizationAccess } from '../_shared/organization-paywall.ts'\nimport { createClient } from 'npm:@supabase/supabase-js@2.95.0'",
              'pending access TypeScript directive position',
          )
          pending_path.write_text(pending)

          photo_path = Path('supabase/functions/provider-sale-photo-stage/index.ts')
          photo = photo_path.read_text()
          photo = replace_once(
              photo,
              "    const { data: { user }, error: userError } = await admin.auth.getUser(jwt)\n    if (userError || !user?.email) return json({ error: 'unauthorized' }, 401)\n\n    const email = user.email.toLowerCase()",
              "    const { data: { user }, error: userError } = await admin.auth.getUser(jwt)\n    if (userError || !user?.email) return json({ error: 'unauthorized' }, 401)\n    const authUserId = user.id\n\n    const email = user.email.toLowerCase()",
              'provider photo stable Auth identity capture',
          )
          photo_replacements = [
              (
                  "        .eq('organization_id', organizationId)\n        .eq('uploaded_by', user.id)\n        .in('status', ['uploading', 'staged', 'failed'])",
                  "        .eq('organization_id', organizationId)\n        .eq('uploaded_by', authUserId)\n        .in('status', ['uploading', 'staged', 'failed'])",
                  'provider photo expired query identity',
              ),
              (
                  "          .delete()\n          .in('id', (expired || []).map(row => row.id))\n          .eq('uploaded_by', user.id)",
                  "          .delete()\n          .in('id', (expired || []).map(row => row.id))\n          .eq('uploaded_by', authUserId)",
                  'provider photo expired delete identity',
              ),
              (
                  "        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('rep_user_id', user.id)\n        .maybeSingle()",
                  "        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('rep_user_id', authUserId)\n        .maybeSingle()",
                  'provider capture identity',
              ),
              (
                  "        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('uploaded_by', user.id)\n        .maybeSingle()",
                  "        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('uploaded_by', authUserId)\n        .maybeSingle()",
                  'staged provider photo identity',
              ),
              (
                  "        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('rep_user_id', user.id)\n        .eq('provider_capture_id', captureId)",
                  "        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('rep_user_id', authUserId)\n        .eq('provider_capture_id', captureId)",
                  'completed provider sale identity',
              ),
          ]
          for before, after, label in photo_replacements:
              photo = replace_once(photo, before, after, label)
          photo_path.write_text(photo)

          generator_path = Path('scripts/apply-edge-paywall-guards.mjs')
          generator = generator_path.read_text()
          pending_open = "await applyDeterministicTransform('pending-account-access','request_organization_scope',source=>{"
          pending_open_after = pending_open + "\n  source=replaceRequired(source,`${importLine}\\n// @ts-nocheck\\n`,`// @ts-nocheck\\n${importLine}\\n`,'pending-account-access TypeScript directive position')"
          generator = replace_once(
              generator,
              pending_open,
              pending_open_after,
              'generator pending TypeScript directive normalization',
          )

          photo_open = "await applyDeterministicTransform('provider-sale-photo-stage','organization_capture_scope_and_atomic_finalize',source=>{"
          photo_open_after = photo_open + dedent(r'''
            const authBefore="    const { data: { user }, error: userError } = await admin.auth.getUser(jwt)\n    if (userError || !user?.email) return json({ error: 'unauthorized' }, 401)\n\n    const email = user.email.toLowerCase()"
            const authAfter="    const { data: { user }, error: userError } = await admin.auth.getUser(jwt)\n    if (userError || !user?.email) return json({ error: 'unauthorized' }, 401)\n    const authUserId = user.id\n\n    const email = user.email.toLowerCase()"
            source=replaceRequired(source,authBefore,authAfter,'provider-sale-photo-stage stable Auth identity capture')''')
          generator = replace_once(
              generator,
              photo_open,
              photo_open_after,
              'generator provider photo Auth capture insertion',
          )

          capture_before = "  const captureBefore=\"      const { data, error } = await admin\\n        .from('provider_sale_captures')\\n        .select('id,client_request_id,rep_user_id,rep_email,provider,status,service_address')\\n        .eq('id', id)\\n        .eq('rep_user_id', user.id)\""
          capture_after_old = "  const captureAfter=\"      const { data, error } = await admin\\n        .from('provider_sale_captures')\\n        .select('id,client_request_id,rep_user_id,rep_email,provider,status,service_address')\\n        .eq('id', id)\\n        .eq('organization_id', organizationId)\\n        .eq('rep_user_id', user.id)\"\n  source=replaceRequired(source,captureBefore,captureAfter,'provider-sale-photo-stage capture tenant scope')"
          capture_after_new = "  const captureLegacyAfter=\"      const { data, error } = await admin\\n        .from('provider_sale_captures')\\n        .select('id,client_request_id,rep_user_id,rep_email,provider,status,service_address')\\n        .eq('id', id)\\n        .eq('organization_id', organizationId)\\n        .eq('rep_user_id', user.id)\"\n  const captureAfter=\"      const { data, error } = await admin\\n        .from('provider_sale_captures')\\n        .select('id,client_request_id,rep_user_id,rep_email,provider,status,service_address')\\n        .eq('id', id)\\n        .eq('organization_id', organizationId)\\n        .eq('rep_user_id', authUserId)\"\n  if(source.includes(captureLegacyAfter))source=replaceRequired(source,captureLegacyAfter,captureAfter,'provider-sale-photo-stage stable capture identity')\n  else source=replaceRequired(source,captureBefore,captureAfter,'provider-sale-photo-stage capture tenant scope')"
          generator = replace_once(
              generator,
              capture_before + "\n" + capture_after_old,
              capture_before + "\n" + capture_after_new,
              'generator provider capture stable identity',
          )

          old_block_marker = "\n  const oldBlock=`        if (!['staged', 'attaching', 'failed'].includes(row.status)) continue"
          nested_block = dedent(r'''

            const nestedIdentityReplacements=[
              ["        .eq('organization_id', organizationId)\n        .eq('uploaded_by', user.id)\n        .in('status', ['uploading', 'staged', 'failed'])","        .eq('organization_id', organizationId)\n        .eq('uploaded_by', authUserId)\n        .in('status', ['uploading', 'staged', 'failed'])",'expired query identity'],
              ["          .delete()\n          .in('id', (expired || []).map(row => row.id))\n          .eq('uploaded_by', user.id)","          .delete()\n          .in('id', (expired || []).map(row => row.id))\n          .eq('uploaded_by', authUserId)",'expired delete identity'],
              ["        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('uploaded_by', user.id)\n        .maybeSingle()","        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('uploaded_by', authUserId)\n        .maybeSingle()",'staged photo identity'],
              ["        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('rep_user_id', user.id)\n        .eq('provider_capture_id', captureId)","        .eq('id', id)\n        .eq('organization_id', organizationId)\n        .eq('rep_user_id', authUserId)\n        .eq('provider_capture_id', captureId)",'completed sale identity']
            ]
            for(const [before,after,label] of nestedIdentityReplacements)source=replaceRequired(source,before,after,`provider-sale-photo-stage ${label}`)''')
          generator = replace_once(
              generator,
              old_block_marker,
              nested_block + old_block_marker,
              'generator provider nested identity transforms',
          )
          generator_path.write_text(generator)

          tenant_test_path = Path('onboarding-tenant-boundary.test.mjs')
          tenant_test = tenant_test_path.read_text()
          tenant_test = replace_once(
              tenant_test,
              "  assert.match(photoStage,/\\.from\\('provider_sale_captures'\\)[\\s\\S]*?\\.eq\\('organization_id', organizationId\\)[\\s\\S]*?\\.eq\\('rep_user_id', user\\.id\\)/)",
              "  assert.match(photoStage,/const authUserId = user\\.id/)\n  assert.match(photoStage,/\\.from\\('provider_sale_captures'\\)[\\s\\S]*?\\.eq\\('organization_id', organizationId\\)[\\s\\S]*?\\.eq\\('rep_user_id', authUserId\\)/)",
              'provider tenant test stable identity',
          )
          tenant_test_path.write_text(tenant_test)

          paywall_test_path = Path('paywall-phase2.test.mjs')
          paywall_test = paywall_test_path.read_text()
          paywall_test = replace_once(
              paywall_test,
              "  assert.match(photoStage,/\\.from\\('provider_sale_captures'\\)[\\s\\S]*?\\.eq\\('id', id\\)[\\s\\S]*?\\.eq\\('organization_id', organizationId\\)[\\s\\S]*?\\.eq\\('rep_user_id', user\\.id\\)/)",
              "  assert.match(photoStage,/const authUserId = user\\.id/)\n  assert.match(photoStage,/\\.from\\('provider_sale_captures'\\)[\\s\\S]*?\\.eq\\('id', id\\)[\\s\\S]*?\\.eq\\('organization_id', organizationId\\)[\\s\\S]*?\\.eq\\('rep_user_id', authUserId\\)/)",
              'paywall provider photo stable identity assertion',
          )
          paywall_test_path.write_text(paywall_test)
          PY

      - name: Verify exact source, generator, and onboarding contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-edge-paywall-guards.mjs
          test "$(head -n 1 supabase/functions/pending-account-access/index.ts)" = "// @ts-nocheck"
          deno check --node-modules-dir=auto supabase/functions/rep-onboarding/index.ts
          deno check --node-modules-dir=auto supabase/functions/pending-account-access/index.ts
          deno check --node-modules-dir=auto supabase/functions/provider-sale-photo-stage/index.ts
          node --test \
            onboarding-membership-integrity.test.mjs \
            onboarding-tenant-boundary.test.mjs \
            import-pending-access-fix.test.mjs \
            paywall-phase2.test.mjs \
            paywall-deployment.test.mjs

      - name: Commit the verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/pending-account-access/index.ts \
            supabase/functions/provider-sale-photo-stage/index.ts \
            scripts/apply-edge-paywall-guards.mjs \
            onboarding-tenant-boundary.test.mjs \
            paywall-phase2.test.mjs
          git diff --cached --check
          git commit -m "Fix onboarding Edge TypeScript checks"
          git push origin HEAD:fix/atomic-onboarding-membership-20260902
