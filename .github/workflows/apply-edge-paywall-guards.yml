name: Apply service-role paywall guards

on:
  push:
    branches:
      - feat/paywall-phase2-webapp-download-20260901
    paths:
      - 'scripts/paywall-targets.mjs'
      - 'scripts/apply-edge-paywall-guards.mjs'
      - 'paywall-phase2.test.mjs'
      - 'supabase/functions/**'
      - '.github/workflows/apply-edge-paywall-guards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-paywall-guards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-guards:
    if: github.actor == 'phillipbeatty-ctrl'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply deterministic entitlement guards
        run: node scripts/apply-edge-paywall-guards.mjs --write

      - name: Verify repository-wide Phase 2 contract
        run: |
          node scripts/apply-edge-paywall-guards.mjs
          node --test organization-access-gate.test.mjs paywall-phase2.test.mjs

      - name: Type-check shared guard and protected functions
        shell: bash
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/_shared/organization-paywall.ts
          node -e "import('./scripts/paywall-targets.mjs').then(({edgePaywallTargets})=>console.log([...edgePaywallTargets.keys()].map(s=>'supabase/functions/'+s+'/index.ts').join('\n')))" | while IFS= read -r file; do
            deno check --node-modules-dir=auto "$file"
          done

      - name: Commit generated guards
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No guard changes were required.'
            exit 0
          fi
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git add supabase/functions scripts/paywall-targets.mjs scripts/apply-edge-paywall-guards.mjs paywall-phase2.test.mjs
          git commit -m 'Enforce Phase 2 organization entitlements in Edge Functions'
          git push origin HEAD:${{ github.ref_name }}
