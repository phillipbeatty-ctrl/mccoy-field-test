name: Harden onboarding review findings once

on:
  push:
    branches:
      - fix/atomic-onboarding-membership-20260902
    paths:
      - .github/workflows/harden-onboarding-review-findings-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out onboarding branch
        uses: actions/checkout@v4
        with:
          ref: fix/atomic-onboarding-membership-20260902
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply reviewed tenant and deployment hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/harden-onboarding-review-findings.py
          python3 .github/scripts/harden-onboarding-review-findings.py

      - name: Retire superseded transforms and refresh exact contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generator_path=Path('scripts/apply-edge-paywall-guards.mjs')
          source=generator_path.read_text()
          superseded=(
            "'pending account access rows'",
            "'pending account requests'",
            "'grant request scope'",
            "'grant access organization'",
            "'grant request update scope'",
            "'pending password access scope'",
          )
          lines=source.splitlines()
          filtered=[line for line in lines if not any(label in line for label in superseded)]
          source='\n'.join(filtered)+'\n'
          before="  source=replaceRequired(source,grantLookup,grantGuard,'rep-onboarding grant cross-organization guard')"
          after="  if(!source.includes(\"if(!request&&!existingAccess)return json({error:'pending_account_not_found'},404)\"))source=replaceRequired(source,grantLookup,grantGuard,'rep-onboarding grant cross-organization guard')"
          if after not in source:
            if source.count(before)!=1:raise SystemExit('grant guard generator marker missing')
            source=source.replace(before,after,1)
          generator_path.write_text(source)

          paywall_path=Path('paywall-phase2.test.mjs')
          paywall=paywall_path.read_text()
          old="assert.match(repOnboarding,/organization_id:callerAccess\\.organization_id,email:target,role:'rep'/)"
          new="assert.match(repOnboarding,/organization_id:callerOrganizationId,email:target,role:'rep'/)"
          if new not in paywall:
            if paywall.count(old)!=1:raise SystemExit('pending grant test assertion marker missing')
            paywall=paywall.replace(old,new,1)
          paywall_path.write_text(paywall)
          PY

      - name: Verify source generation, TypeScript, and security contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-edge-paywall-guards.mjs
          deno check --node-modules-dir=auto supabase/functions/rep-onboarding/index.ts
          deno check --node-modules-dir=auto supabase/functions/pending-account-access/index.ts
          deno check --node-modules-dir=auto supabase/functions/provider-sale-photo-stage/index.ts
          deno check --node-modules-dir=auto supabase/functions/spotio-admin/index.ts
          node --test \
            onboarding-membership-integrity.test.mjs \
            onboarding-tenant-boundary.test.mjs \
            import-pending-access-fix.test.mjs \
            paywall-phase2.test.mjs \
            paywall-deployment.test.mjs

      - name: Commit verified hardening without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/harden-onboarding-review-findings.py
          rm -rf .github/scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/rep-onboarding/index.ts \
            supabase/functions/spotio-admin/index.ts \
            scripts/apply-edge-paywall-guards.mjs \
            onboarding-tenant-boundary.test.mjs \
            onboarding-membership-integrity.test.mjs \
            paywall-phase2.test.mjs \
            .github/scripts/harden-onboarding-review-findings.py
          git diff --cached --check
          git commit -m "Harden onboarding tenant boundaries"
          git push origin HEAD:fix/atomic-onboarding-membership-20260902
