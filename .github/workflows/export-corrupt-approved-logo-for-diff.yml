name: Export staged Field Coach logo for repair diff

on:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.github/workflows/export-corrupt-approved-logo-for-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-staged-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v5
        with:
          ref: fix/approved-official-logo-beta4-20260901
          fetch-depth: 0

      - name: Salvage staged archive and reconstruct current JPEG
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'mccoy-logo-beta4-patch.b64.part*' | sort)
          test "${#parts[@]}" -eq 20
          for index in $(seq -w 0 18); do
            test "$(wc -c < ".bootstrap/mccoy-logo-beta4-patch.b64.part${index}")" -eq 8000
          done
          test "$(wc -c < .bootstrap/mccoy-logo-beta4-patch.b64.part19)" -eq 7828
          cat "${parts[@]}" | base64 --decode > /tmp/staged-logo-patch.tar.gz

          set +e
          gzip -dc /tmp/staged-logo-patch.tar.gz > /tmp/staged-logo-patch.tar
          gzip_status=$?
          set -e
          echo "gzip salvage status: ${gzip_status}"
          test -s /tmp/staged-logo-patch.tar

          mkdir -p /tmp/recovered
          set +e
          tar --ignore-zeros -xf /tmp/staged-logo-patch.tar -C /tmp/recovered --wildcards './assets/brand/source-staging/official-logo-source-original.jpg.b64.part*' 2>/tmp/tar-errors.txt
          extract_status=$?
          set -e
          echo "tar extraction status: ${extract_status}"
          cat /tmp/tar-errors.txt || true

          mapfile -t source_parts < <(find /tmp/recovered -type f -name 'official-logo-source-original.jpg.b64.part*' | sort)
          test "${#source_parts[@]}" -eq 7
          cat "${source_parts[@]}" | base64 --decode > /tmp/recovered-approved-upload-original.jpg
          test -s /tmp/recovered-approved-upload-original.jpg
          sha256sum /tmp/recovered-approved-upload-original.jpg | tee /tmp/recovered-approved-upload-original.jpg.sha256
          echo 'ce74f55cc14bea0c1aed4e490dd20f4890ad06af546f70491ed7fb0d5b1b598a  /tmp/recovered-approved-upload-original.jpg' | sha256sum -c -

      - name: Upload staged JPEG evidence
        uses: actions/upload-artifact@v4
        with:
          name: field-coach-staged-logo-diff-source
          path: |
            /tmp/recovered-approved-upload-original.jpg
            /tmp/recovered-approved-upload-original.jpg.sha256
          if-no-files-found: error
          retention-days: 1
