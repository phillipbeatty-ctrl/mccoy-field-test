name: Field Coach Android Internal Beta

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'assets/**'
      - 'downloads/**'
      - 'mobile/**'
      - 'scripts/build-mobile-web.mjs'
      - 'scripts/configure-native-project.mjs'
      - 'scripts/generate-field-coach-icons.py'
      - 'scripts/apply-field-coach-icon-links.py'
      - 'scripts/verify-png-content.mjs'
      - 'scripts/field-coach-icons-requirements.txt'
      - 'scripts/mobile-release-doctor.mjs'
      - 'mobile-release.test.mjs'
      - 'APP_RELEASE.md'
      - '.github/workflows/field-coach-android-internal.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.webmanifest'
  push:
    branches:
      - main
      - fix/field-coach-logo-android-beta3-20260901
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'assets/**'
      - 'downloads/**'
      - 'mobile/**'
      - 'scripts/build-mobile-web.mjs'
      - 'scripts/configure-native-project.mjs'
      - 'scripts/generate-field-coach-icons.py'
      - 'scripts/apply-field-coach-icon-links.py'
      - 'scripts/verify-png-content.mjs'
      - 'scripts/field-coach-icons-requirements.txt'
      - 'scripts/mobile-release-doctor.mjs'
      - 'mobile-release.test.mjs'
      - 'APP_RELEASE.md'
      - '.github/workflows/field-coach-android-internal.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.webmanifest'

permissions:
  contents: write

concurrency:
  group: field-coach-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-internal-beta:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[android-beta3-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: 1.0.0-beta.3
      ANDROID_BUILD_TOOLS: 36.0.0
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install pinned mobile and icon dependencies
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check -r scripts/field-coach-icons-requirements.txt

      - name: Generate and inspect browser and native icon sources
        run: |
          python3 scripts/apply-field-coach-icon-links.py
          npm run icons:generate
          npm run icons:verify | tee icon-source-evidence.jsonl
          ! grep -qiE '<image|data:image' assets/logo.svg

      - name: Verify mobile release contract
        run: npm run test:mobile

      - name: Generate bundled web assets and Android project
        run: npm run mobile:android:prepare

      - name: Verify generated Android launcher resources before compilation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t launchers < <(find android/app/src/main/res -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_foreground.png' \) | sort)
          test "${#launchers[@]}" -gt 0
          node scripts/verify-png-content.mjs "${launchers[@]}" | tee generated-launcher-evidence.jsonl

      - name: Run release doctor
        run: npm run mobile:doctor

      - name: Build debug APK and unsigned release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease

      - name: Verify and package Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist downloads /tmp/field-coach-apk-icons
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Field-Coach-Android-${APP_VERSION}-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Field-Coach-Android-${APP_VERSION}-unsigned.aab"
          cp mobile-release-doctor.json dist/mobile-release-doctor.json
          cp mobile-web/mobile-build.json dist/mobile-build.json
          cp icon-source-evidence.jsonl generated-launcher-evidence.jsonl dist/

          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "dist/Field-Coach-Android-${APP_VERSION}-debug.apk" > dist/apk-badging.txt
          grep -q "package: name='com.mccoyplatform.app'" dist/apk-badging.txt
          grep -q "versionCode='3'" dist/apk-badging.txt
          grep -q "versionName='1.0.0-beta.3'" dist/apk-badging.txt
          grep -q "application-label:'Field Coach'" dist/apk-badging.txt
          grep -q "targetSdkVersion:'36'" dist/apk-badging.txt

          unzip -q "dist/Field-Coach-Android-${APP_VERSION}-debug.apk" 'res/mipmap*/ic_launcher*.png' -d /tmp/field-coach-apk-icons
          mapfile -t packaged_icons < <(find /tmp/field-coach-apk-icons -type f -name 'ic_launcher*.png' | sort)
          test "${#packaged_icons[@]}" -gt 0
          node scripts/verify-png-content.mjs "${packaged_icons[@]}" | tee dist/apk-launcher-evidence.jsonl

          test -s "dist/Field-Coach-Android-${APP_VERSION}-debug.apk"
          test -s "dist/Field-Coach-Android-${APP_VERSION}-unsigned.aab"
          (cd dist && sha256sum Field-Coach-Android-${APP_VERSION}-debug.apk Field-Coach-Android-${APP_VERSION}-unsigned.aab apk-badging.txt mobile-build.json mobile-release-doctor.json icon-source-evidence.jsonl generated-launcher-evidence.jsonl apk-launcher-evidence.jsonl > SHA256SUMS.txt)

          cp "dist/Field-Coach-Android-${APP_VERSION}-debug.apk" "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk"
          sha256sum "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk" > "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk.sha256"

      - name: Publish stable Android beta download into the repair branch
        if: github.event_name == 'push' && github.ref_name == 'fix/field-coach-logo-android-beta3-20260901'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add assets/*.png downloads/ *.html
          if git diff --cached --quiet; then
            echo 'Generated icon and Android download files are already current.'
            exit 0
          fi
          git commit -m 'Publish verified Field Coach Android beta 3 [android-beta3-generated]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload Field Coach Android internal beta
        uses: actions/upload-artifact@v4
        with:
          name: Field-Coach-Android-1.0.0-beta.3
          path: dist/
          if-no-files-found: error
          retention-days: 30
