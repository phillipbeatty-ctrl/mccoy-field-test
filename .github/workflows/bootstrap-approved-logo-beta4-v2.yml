name: Bootstrap approved Field Coach logo beta 4 v2

on:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-approved-logo-beta4-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-logo-beta4-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-approved-logo:
    if: ${{ !contains(github.event.head_commit.message || '', '[approved-logo-bootstrap-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/approved-official-logo-beta4-20260901

      - name: Verify staged transport and extract patch
        shell: bash
        run: |
          set -euo pipefail

          corrections=(
            .bootstrap/verified-part14.00
            .bootstrap/verified-part14.01
            .bootstrap/verified-part14.02
            .bootstrap/verified-part14.03
            .bootstrap/verified-part17.00
            .bootstrap/verified-part17.01
            .bootstrap/verified-part17.02
            .bootstrap/verified-part17.03
          )
          test "${#corrections[@]}" -eq 8
          for correction in "${corrections[@]}"; do
            test -f "$correction"
            test "$(wc -c < "$correction")" -eq 2000
          done
          cat <<'HASHES' | sha256sum -c -
          3f21944d97945f634f0df7f5a70fcb8ec988bff9c26a292029b76398fec30911  .bootstrap/verified-part14.00
          0fd4bf3fc0b1c617b04593edd0ce02f8a9b0f04a88c3ea5501a77a23018e298c  .bootstrap/verified-part14.01
          ccdc3d958055e76018ed13d7d327473ad9202ef8ccd19a75d0f5a110df7ac8e6  .bootstrap/verified-part14.02
          6d17b256873764ea880cdc58f8cf62dc7896fdd07d980f0f2a3c6fba2fd62cb7  .bootstrap/verified-part14.03
          c42f12db57c2954a20c719d142f68e3c0638ebf312f447f3d8fb56dbbf86f499  .bootstrap/verified-part17.00
          02e9e80ce7adf29497cf938e4234e8fdf0d5d25a6eebb61c727d449ad677e69a  .bootstrap/verified-part17.01
          9e651c1a5272fc510536f92fdcc697d7411c76633fb46de86e16cd2fd1319d61  .bootstrap/verified-part17.02
          366999dd01c3b523ecc4806eb159b6e52e8b567692d47945e6b09a305590a362  .bootstrap/verified-part17.03
          HASHES
          cat .bootstrap/verified-part14.* > .bootstrap/mccoy-logo-beta4-patch.b64.part14
          cat .bootstrap/verified-part17.* > .bootstrap/mccoy-logo-beta4-patch.b64.part17
          echo '473de9bacb5f7bf64ccf756daecec0f8efba75f0fef738a4a186d83747e95713  .bootstrap/mccoy-logo-beta4-patch.b64.part14' | sha256sum -c -
          echo '6d59d40ffc932b16fdd5f54f574707fdc73448ef3928571743503cb64846a02c  .bootstrap/mccoy-logo-beta4-patch.b64.part17' | sha256sum -c -

          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'mccoy-logo-beta4-patch.b64.part*' | sort)
          test "${#parts[@]}" -eq 20
          for index in $(seq -w 0 18); do
            test "$(wc -c < ".bootstrap/mccoy-logo-beta4-patch.b64.part${index}")" -eq 8000
          done
          test "$(wc -c < .bootstrap/mccoy-logo-beta4-patch.b64.part19)" -eq 7828
          cat "${parts[@]}" | base64 --decode > /tmp/mccoy-logo-beta4-patch.tar.gz
          echo 'd118b20ae1a0996950f56c7c53970b934457a5eec0652cd99fd737a506678964  /tmp/mccoy-logo-beta4-patch.tar.gz' | sha256sum -c -
          tar -tzf /tmp/mccoy-logo-beta4-patch.tar.gz | tee /tmp/mccoy-logo-beta4-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/mccoy-logo-beta4-files.txt; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          tar -xzf /tmp/mccoy-logo-beta4-patch.tar.gz -C .

      - name: Materialize and verify approved source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r scripts/field-coach-icons-requirements.txt
          python3 scripts/materialize-approved-logo-source.py
          python3 scripts/verify-official-logo-source.py
          python3 scripts/generate-field-coach-icons.py
          node scripts/verify-png-content.mjs

      - name: Run release contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-mobile-web.mjs
          node --check scripts/configure-native-project.mjs
          node --check scripts/mobile-release-doctor.mjs
          node --check scripts/build-webapp-download.mjs
          node --test mobile-release.test.mjs webapp-download.test.mjs app-update-recovery.test.mjs

      - name: Remove transport and commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-approved-logo-beta4.yml
          rm -f .github/workflows/bootstrap-approved-logo-beta4-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No verified patch changes found.' >&2; exit 1; }
          git commit -m 'Apply owner-approved logo source and beta 4 release contract [approved-logo-bootstrap-complete]'
          git push origin HEAD:fix/approved-official-logo-beta4-20260901
