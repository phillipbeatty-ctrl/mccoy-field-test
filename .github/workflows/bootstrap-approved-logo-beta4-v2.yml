name: Bootstrap approved Field Coach logo beta 4 v2

on:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.github/workflows/bootstrap-approved-logo-beta4-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-logo-beta4-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-approved-logo:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[run-approved-logo-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/approved-official-logo-beta4-20260901

      - name: Decode the exact approved JPEG transport
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'approved-upload-original.b64.part*' | sort)
          test "${#parts[@]}" -eq 11
          for index in $(seq -w 0 09); do
            test "$(wc -c < ".bootstrap/approved-upload-original.b64.part${index}")" -eq 12000
          done
          test "$(wc -c < .bootstrap/approved-upload-original.b64.part10)" -eq 9064
          cat "${parts[@]}" > /tmp/approved-upload-original.jpg.b64
          echo '78959d28bbb3b8124431c2371a33a604e1436626bebe0fcc8155c362668ab20d  /tmp/approved-upload-original.jpg.b64' | sha256sum -c -
          mkdir -p assets/brand
          base64 --decode /tmp/approved-upload-original.jpg.b64 > assets/brand/approved-upload-original.jpg
          echo '227203e1c0ab14a1aa400e6f0d1411a6512222a685589df92dac3f3c1633cd90  assets/brand/approved-upload-original.jpg' | sha256sum -c -

      - name: Materialize and verify the approved PNG source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r scripts/field-coach-icons-requirements.txt
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('assets/brand/approved-upload-original.jpg')
          target = Path('assets/brand/official-logo-source.png')
          with Image.open(source) as image:
              image.load()
              if image.size != (1024, 1024):
                  raise SystemExit(f'unexpected approved source dimensions: {image.size}')
              image.convert('RGB').save(target, format='PNG', optimize=True, compress_level=9)
          Path('assets/brand/official-logo-source.sha256').write_text(
              'ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5  assets/brand/official-logo-source.png\n',
              encoding='utf-8',
          )
          PY
          echo 'ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5  assets/brand/official-logo-source.png' | sha256sum -c -
          python3 scripts/verify-approved-logo-source.py

      - name: Generate and inspect every logo derivative
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-field-coach-icons.py
          node scripts/verify-png-content.mjs assets/favicon-64.png assets/apple-touch-icon-180.png assets/icon-192.png assets/icon-512.png assets/icon-maskable-512.png assets/icon-only.png assets/icon-foreground.png

      - name: Run beta 4 release contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-mobile-web.mjs
          node --check scripts/configure-native-project.mjs
          node --check scripts/mobile-release-doctor.mjs
          node --check scripts/build-webapp-download.mjs
          node --test mobile-release.test.mjs webapp-download.test.mjs app-update-recovery.test.mjs

      - name: Remove temporary transport and commit the verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -rf assets/brand/source-staging
          rm -f .github/workflows/bootstrap-approved-logo-beta4.yml
          rm -f .github/workflows/bootstrap-approved-logo-beta4-v2.yml
          rm -f .github/workflows/diagnose-logo-transport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No verified patch changes found.' >&2; exit 1; }
          git commit -m 'Apply owner-approved logo source and beta 4 release contract [approved-logo-bootstrap-complete]'
          git push origin HEAD:fix/approved-official-logo-beta4-20260901
