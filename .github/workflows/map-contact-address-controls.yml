name: Map and lead field controls

on:
  pull_request:
    paths:
      - 'app-map-manual-control.js'
      - 'app-field-lead-editor.js'
      - 'app-page-layout.js'
      - 'supabase/functions/lead-field-actions/**'
      - 'supabase/migrations/20260830223000_all_users_lead_contact_and_field_addresses.sql'
      - 'scripts/read-only-spotio-batch-recovery.mjs'
      - 'map-contact-address-controls.test.mjs'
      - '.github/workflows/map-contact-address-controls.yml'
  workflow_dispatch:

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node --check app-map-manual-control.js
      - run: node --check app-field-lead-editor.js
      - run: node --check app-page-layout.js
      - run: node --check scripts/read-only-spotio-batch-recovery.mjs
      - run: node --test map-contact-address-controls.test.mjs
      - run: deno check --node-modules-dir=auto supabase/functions/lead-field-actions/index.ts
