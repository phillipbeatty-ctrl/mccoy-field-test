name: Live Feed local Supabase Docker validation

on:
  pull_request:
    paths:
      - app-live-feed.js
      - app-live-wins.js
      - live-feed-comments-contract.test.mjs
      - live-feed-local-harness.test.mjs
      - scripts/test-live-feed-local.sh
      - tests/live-feed-local/**
      - supabase/preview-migrations/20260903062000_live_feed_company_team_comments_preview.sql
      - supabase/tests/live-feed-comments-preview-canary.sql
      - docs/live-feed-comments-preview.md
      - docs/live-feed-free-test-plan.md
      - package.json
      - .github/workflows/live-feed-local-supabase.yml
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - app-live-feed.js
      - app-live-wins.js
      - live-feed-comments-contract.test.mjs
      - live-feed-local-harness.test.mjs
      - scripts/test-live-feed-local.sh
      - tests/live-feed-local/**
      - supabase/preview-migrations/20260903062000_live_feed_company_team_comments_preview.sql
      - supabase/tests/live-feed-comments-preview-canary.sql
      - docs/live-feed-comments-preview.md
      - docs/live-feed-free-test-plan.md
      - package.json
      - .github/workflows/live-feed-local-supabase.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-feed-local-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-docker-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the free-test harness contract
        run: node --test --test-reporter=spec live-feed-local-harness.test.mjs

      - name: Run isolated local Supabase Docker canary
        env:
          SUPABASE_CLI_VERSION: 2.116.0
        run: bash scripts/test-live-feed-local.sh
