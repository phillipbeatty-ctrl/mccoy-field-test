name: Finalize Live Feed preview scope once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/scripts/finalize-live-feed-preview-scope.py
      - .github/workflows/finalize-live-feed-preview-scope-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Move preview SQL outside production migrations and align regression assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize-live-feed-preview-scope.py
          test ! -e supabase/migrations/20260903062000_live_feed_comments_vertical_slice.sql
          test -e supabase/preview-migrations/20260903062000_live_feed_company_team_comments_preview.sql
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          node --test --test-reporter=spec live-feed-comments-contract.test.mjs
          node --test --test-reporter=spec sale-completion-runtime.test.mjs
          node --test --test-reporter=spec customer-list-stable-actions.test.mjs
          node --test --test-reporter=spec organization-access-gate.test.mjs
          node --test --test-reporter=spec app-update-recovery.test.mjs
          ! git diff --name-only origin/main | grep -E '^supabase/migrations/'

      - name: Commit final preview cleanup and remove one-time scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/finalize-live-feed-preview-scope.py
          rm -f .github/workflows/finalize-live-feed-preview-scope-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Keep Live Feed SQL preview-only and align cache contracts'
          git push origin HEAD:preview/live-feed-comments-20260903
