name: Apply Live Feed moderation preview once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/workflows/apply-live-feed-moderation-preview-once.yml

permissions:
  contents: write

jobs:
  apply-moderation-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v5
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Repair exact cache-key assertion targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/apply-live-feed-moderation-preview.py')
          source=path.read_text(encoding='utf-8')
          replacements=[
            (
              'test = replace_once(test, "app-live-feed\\\\.js\\\\?v=2026090301", "app-live-feed\\\\.js\\\\?v=2026090302", "test client cache key")',
              'test = replace_once(test, "assert.match(liveWins,/app-live-feed\\\\.js\\\\?v=2026090301/)", "assert.match(liveWins,/app-live-feed\\\\.js\\\\?v=2026090302/)", "test client cache key")'
            ),
            (
              'test = replace_once(test, "\'/app-live-feed\\\\.js\\\\?v=2026090301\'", "\'/app-live-feed\\\\.js\\\\?v=2026090302\'", "test worker cache key")',
              'test = replace_once(test, "assert.match(worker,/\'\\\\/app-live-feed\\\\.js\\\\?v=2026090301\'/)", "assert.match(worker,/\'\\\\/app-live-feed\\\\.js\\\\?v=2026090302\'/)", "test worker cache key")'
            ),
          ]
          for old,new in replacements:
              if source.count(old)!=1:
                  raise SystemExit(f'expected one cache-key applicator line, found {source.count(old)} for {old}')
              source=source.replace(old,new,1)
          path.write_text(source,encoding='utf-8')
          PY

      - name: Materialize fail-closed moderation
        run: python3 .github/scripts/apply-live-feed-moderation-preview.py

      - name: Align assertions with approved-only delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('live-feed-comments-contract.test.mjs')
          source=path.read_text(encoding='utf-8')
          replacements=[
            (
              r"assert.match(client,/if\(!row\|\|ownById\|\|ownByEmail\)return/)",
              r"assert.match(client,/ownById\|\|ownByEmail\)return/)"
            ),
            (
              r"assert.match(moderate,/p_decision not in \('approve','reject'\)/)",
              r"assert.match(moderate,/v_decision not in \('approve','reject'\)/)"
            ),
          ]
          for old,new in replacements:
              if source.count(old)!=1:
                  raise SystemExit(f'expected one assertion, found {source.count(old)} for {old}')
              source=source.replace(old,new,1)
          path.write_text(source,encoding='utf-8')
          PY

      - name: Verify Live Feed preview contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          node --test live-feed-comments-contract.test.mjs
          git diff --check

      - name: Commit verified moderation preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app-live-feed.js \
            app-live-wins.js \
            service-worker.js \
            live-feed-comments-contract.test.mjs \
            docs/live-feed-comments-preview.md \
            supabase/migrations/20260903063000_live_feed_comment_moderation_quarantine.sql \
            supabase/tests/live-feed-comments-preview-canary.sql
          git diff --cached --check
          git commit -m "Quarantine Live Feed comments until Admin approval"
          git push origin HEAD:preview/live-feed-comments-20260903
