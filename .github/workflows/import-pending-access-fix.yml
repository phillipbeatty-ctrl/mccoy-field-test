name: Import and Pending Access Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spotio-import.html'
      - 'spotio-import-compat.js'
      - 'app-pending-access-fix.js'
      - 'app-admin-lead-import.js'
      - 'pending-access.html'
      - 'pending-access.js'
      - 'supabase/functions/pending-account-access/**'
      - 'supabase/migrations/20260903004737_atomic_onboarding_organization_membership_integrity.sql'
      - 'supabase/migrations/20260903012549_restrict_onboarding_identity_helper_execution.sql'
      - 'supabase/tests/onboarding-membership-integrity-canary.sql'
      - 'import-pending-access-fix.test.mjs'
      - 'onboarding-membership-integrity.test.mjs'
      - '.github/workflows/deploy-onboarding-integrity.yml'
      - '.github/workflows/import-pending-access-fix.yml'
  push:
    branches: [main]
    paths:
      - 'spotio-import.html'
      - 'spotio-import-compat.js'
      - 'app-pending-access-fix.js'
      - 'app-admin-lead-import.js'
      - 'pending-access.html'
      - 'pending-access.js'
      - 'supabase/functions/pending-account-access/**'
      - 'supabase/migrations/20260903004737_atomic_onboarding_organization_membership_integrity.sql'
      - 'supabase/migrations/20260903012549_restrict_onboarding_identity_helper_execution.sql'
      - 'supabase/tests/onboarding-membership-integrity-canary.sql'
      - 'import-pending-access-fix.test.mjs'
      - 'onboarding-membership-integrity.test.mjs'
      - '.github/workflows/deploy-onboarding-integrity.yml'
      - '.github/workflows/import-pending-access-fix.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser and Edge syntax
        run: |
          node --check spotio-import-compat.js
          node --check app-pending-access-fix.js
          node --check app-admin-lead-import.js
          node --check pending-access.js
          cp supabase/functions/pending-account-access/index.ts /tmp/pending-account-access.mjs
          node --check /tmp/pending-account-access.mjs
      - name: Validate guarded deployment workflow YAML
        run: ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/deploy-onboarding-integrity.yml'); puts 'onboarding deployment workflow YAML parsed'"
      - name: Run importer and pending account regression tests
        run: |
          node --test \
            import-pending-access-fix.test.mjs \
            onboarding-membership-integrity.test.mjs
