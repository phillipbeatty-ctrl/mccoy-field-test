name: Import and Pending Access Regression

on:
  pull_request:
    paths:
      - 'scripts/apply-edge-paywall-guards.mjs'
      - 'scripts/normalize-onboarding-generated-source.mjs'
      - 'supabase/functions/rep-onboarding/**'
      - 'supabase/functions/pending-account-access/**'
      - 'supabase/functions/provider-sale-photo-stage/**'
      - '.github/workflows/import-pending-access-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-generated-source:
    if: github.actor == 'phillipbeatty-ctrl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize generated onboarding source
        run: |
          node scripts/apply-edge-paywall-guards.mjs --write
          node scripts/normalize-onboarding-generated-source.mjs --write
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Generated source is already normalized.'
            exit 0
          fi
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git add supabase/functions
          git commit -m 'Normalize generated onboarding source'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
