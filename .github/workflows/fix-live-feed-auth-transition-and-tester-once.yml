name: Fix Live Feed auth transition and tester authority once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/scripts/fix-live-feed-auth-transition-and-tester.py
      - .github/workflows/fix-live-feed-auth-transition-and-tester-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Apply auth transition and tester authority fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix-live-feed-auth-transition-and-tester.py
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          node --test --test-reporter=spec live-feed-comments-contract.test.mjs
          grep -q 'auth.onAuthStateChange' app-live-feed.js
          grep -q "private.live_feed_normalized_role(access.role)" supabase/preview-migrations/20260903062000_live_feed_company_team_comments_preview.sql
          grep -q "then 'rep'" supabase/preview-migrations/20260903062000_live_feed_company_team_comments_preview.sql
          grep -q 'tester role was not normalized to Rep Live Feed authority' supabase/tests/live-feed-comments-preview-canary.sql

      - name: Commit verified fixes and remove one-time scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix-live-feed-auth-transition-and-tester.py
          rm -f .github/workflows/fix-live-feed-auth-transition-and-tester-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Reset Live Feed on auth transition and normalize testers'
          git push origin HEAD:preview/live-feed-comments-20260903
