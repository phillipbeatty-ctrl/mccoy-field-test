name: Apply Auth email implementation bundle

on:
  push:
    branches:
      - fix/auth-email-production-delivery-20260831
    paths:
      - '.mccoy-auth-email-bundle/**'
      - '.github/workflows/apply-auth-email-bundle.yml'

permissions:
  contents: write

concurrency:
  group: apply-auth-email-bundle
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-email-production-delivery-20260831
          fetch-depth: 0

      - name: Expand, verify, and commit non-workflow Auth email files
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          root = Path('.')
          bundle_dir = root / '.mccoy-auth-email-bundle'
          parts = [bundle_dir / f'part-{index:02d}' for index in range(8)]
          missing = [str(path) for path in parts if not path.exists()]
          if missing:
              raise RuntimeError(f'Missing Auth email bundle parts: {missing}')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          manifest = json.loads(gzip.decompress(base64.b64decode(encoded)))
          if manifest.get('version') != 1:
              raise RuntimeError('Unsupported Auth email bundle version')

          files = manifest.get('files') or []
          if len(files) != 18:
              raise RuntimeError(f'Unexpected Auth email bundle file count: {len(files)}')

          for item in files:
              relative = Path(item['path'])
              if relative.is_absolute() or '..' in relative.parts:
                  raise RuntimeError(f'Unsafe bundle path: {relative}')
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(item['content'], encoding='utf-8')
              if item.get('mode') == '100755':
                  target.chmod(0o755)
          PY

          node --check app-auth-production-redirect.js
          node --check confirm-email.js
          node --check pending-access.js
          node --check service-worker.js
          node --check scripts/configure-production-auth-email.mjs
          cp supabase/functions/pending-account-access/index.ts /tmp/pending-account-access.mjs
          cp supabase/functions/auth-email-resend/index.ts /tmp/auth-email-resend.mjs
          cp supabase/functions/auth-email-status/index.ts /tmp/auth-email-status.mjs
          cp supabase/functions/auth-email-confirmed/index.ts /tmp/auth-email-confirmed.mjs
          cp supabase/functions/auth-email-provider-webhook/index.ts /tmp/auth-email-provider-webhook.mjs
          node --check /tmp/pending-account-access.mjs
          node --check /tmp/auth-email-resend.mjs
          node --check /tmp/auth-email-status.mjs
          node --check /tmp/auth-email-confirmed.mjs
          node --check /tmp/auth-email-provider-webhook.mjs
          node --test auth-email-production.test.mjs

          rm -f .github/workflows/auth-email-production-regression.yml
          rm -f .github/workflows/configure-production-auth-email.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-auth-production-redirect.js confirm-email.html confirm-email.js pending-access.html pending-access.js service-worker.js \
            supabase/functions/pending-account-access/index.ts \
            supabase/functions/auth-email-resend/index.ts \
            supabase/functions/auth-email-status/index.ts \
            supabase/functions/auth-email-confirmed/index.ts \
            supabase/functions/auth-email-provider-webhook/index.ts \
            supabase/migrations/20260831023000_auth_email_delivery_observability.sql \
            scripts/configure-production-auth-email.mjs docs/production-auth-email.md \
            auth-email-production.test.mjs import-pending-access-fix.test.mjs
          git commit -m 'Implement production Auth email delivery controls'
          git push origin HEAD:fix/auth-email-production-delivery-20260831
