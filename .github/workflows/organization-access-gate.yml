name: Organization access paywall gate

on:
  pull_request:
    paths:
      - 'app-organization-access-gate.js'
      - 'index.html'
      - 'organization-access-gate.test.mjs'
      - 'supabase/functions/organization-access/**'
      - 'supabase/migrations/20260901033000_organization_access_paywall_gate.sql'
      - 'supabase/migrations/20260901033100_organization_access_policy_execute_permission.sql'
      - '.github/workflows/organization-access-gate.yml'
  workflow_dispatch:

jobs:
  paywall-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node --check app-organization-access-gate.js
      - run: node --test organization-access-gate.test.mjs
      - run: deno check --node-modules-dir=auto supabase/functions/organization-access/index.ts
