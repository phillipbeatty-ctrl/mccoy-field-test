name: Repair onboarding TypeScript nullability once

on:
  push:
    branches:
      - fix/atomic-onboarding-membership-20260902
    paths:
      - .github/workflows/repair-onboarding-nullability-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out onboarding branch
        uses: actions/checkout@v4
        with:
          ref: fix/atomic-onboarding-membership-20260902
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply the proven TypeScript narrowing repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              if after in text:
                  return text
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source marker, found {count}")
              return text.replace(before, after, 1)

          source_path = Path('supabase/functions/rep-onboarding/index.ts')
          source = source_path.read_text()
          source = replace_once(
              source,
              "    const {data:{user},error:uerr}=await admin.auth.getUser(jwt); if(uerr||!user?.email) return json({error:'unauthorized'},401)\n    const email=user.email.toLowerCase(); const body=await req.json().catch(()=>({})); const action=String(body.action||'status')",
              "    const {data:{user},error:uerr}=await admin.auth.getUser(jwt); if(uerr||!user?.email) return json({error:'unauthorized'},401)\n    const authUserId=user.id\n    const email=user.email.toLowerCase(); const body=await req.json().catch(()=>({})); const action=String(body.action||'status')",
              'rep-onboarding stable Auth identity capture',
          )
          source = replace_once(
              source,
              "p_auth_user_id:user.id,p_entitlement:entitlement",
              "p_auth_user_id:authUserId,p_entitlement:entitlement",
              'rep-onboarding organization assertion identity',
          )
          source = replace_once(
              source,
              "    if(!callerAccess?.active||callerAccess.role!=='admin') return json({error:'admin_only'},403)\n    const adminAccessDenied=await requireOrganizationAccess('admin_controls')",
              "    if(!callerAccess?.active||callerAccess.role!=='admin') return json({error:'admin_only'},403)\n    const callerOrganizationId=callerAccess.organization_id\n    const adminAccessDenied=await requireOrganizationAccess('admin_controls')",
              'rep-onboarding stable caller organization capture',
          )
          nested_start = source.index("    async function validateManager")
          nested_end = source.index("    if(action==='set_secondary_admin')", nested_start)
          nested = source[nested_start:nested_end]
          nested_count = nested.count('callerAccess.organization_id')
          if nested_count != 4:
              raise SystemExit(f"rep-onboarding nested organization references: expected 4, found {nested_count}")
          nested = nested.replace('callerAccess.organization_id', 'callerOrganizationId')
          source = source[:nested_start] + nested + source[nested_end:]
          source_path.write_text(source)

          generator_path = Path('scripts/apply-edge-paywall-guards.mjs')
          generator = generator_path.read_text()
          generator_marker = "  const callerAccessLine=\"    const {data:callerAccess}=await admin.from('app_user_access').select('email,role,active,display_name,sales_classification,team_name,assigned_manager_email,assigned_manager_name,assigned_admin_email,assigned_admin_name,organization_id').eq('email',email).maybeSingle()\""
          generator_auth_transform = r'''  source=replaceRequired(
            source,
            "    const {data:{user},error:uerr}=await admin.auth.getUser(jwt); if(uerr||!user?.email) return json({error:'unauthorized'},401)\n    const email=user.email.toLowerCase(); const body=await req.json().catch(()=>({})); const action=String(body.action||'status')",
            "    const {data:{user},error:uerr}=await admin.auth.getUser(jwt); if(uerr||!user?.email) return json({error:'unauthorized'},401)\n    const authUserId=user.id\n    const email=user.email.toLowerCase(); const body=await req.json().catch(()=>({})); const action=String(body.action||'status')",
            'rep-onboarding stable Auth identity capture'
          )

          '''
          if 'rep-onboarding stable Auth identity capture' not in generator:
              generator = replace_once(
                  generator,
                  generator_marker,
                  generator_auth_transform + generator_marker,
                  'generator Auth identity transform insertion',
              )
          generator = replace_once(
              generator,
              "p_auth_user_id:user.id,p_entitlement:entitlement",
              "p_auth_user_id:authUserId,p_entitlement:entitlement",
              'generator organization assertion identity',
          )
          generator = replace_once(
              generator,
              "  const adminAfter=\"    if(!callerAccess?.active||callerAccess.role!=='admin') return json({error:'admin_only'},403)\\n    const adminAccessDenied=await requireOrganizationAccess('admin_controls')\\n    if(adminAccessDenied)return adminAccessDenied\"",
              "  const adminAfter=\"    if(!callerAccess?.active||callerAccess.role!=='admin') return json({error:'admin_only'},403)\\n    const callerOrganizationId=callerAccess.organization_id\\n    const adminAccessDenied=await requireOrganizationAccess('admin_controls')\\n    if(adminAccessDenied)return adminAccessDenied\"",
              'generator caller organization capture',
          )
          generator_replacements = [
              (
                  "admin.from('app_user_access').select('email,display_name,role,active,assigned_manager_email,assigned_admin_email').eq('organization_id',callerAccess.organization_id).eq('email',mgrEmail)",
                  "admin.from('app_user_access').select('email,display_name,role,active,assigned_manager_email,assigned_admin_email').eq('organization_id',callerOrganizationId).eq('email',mgrEmail)",
                  'generator manager validation organization capture',
              ),
              (
                  "admin.from('app_user_access').select('email,display_name,role,active').eq('organization_id',callerAccess.organization_id).eq('email',adminEmail)",
                  "admin.from('app_user_access').select('email,display_name,role,active').eq('organization_id',callerOrganizationId).eq('email',adminEmail)",
                  'generator administrator validation organization capture',
              ),
              (
                  "admin.from('teams').select('id').eq('organization_id',callerAccess.organization_id).eq('name',team).maybeSingle()",
                  "admin.from('teams').select('id').eq('organization_id',callerOrganizationId).eq('name',team).maybeSingle()",
                  'generator profile team organization capture',
              ),
              (
                  "admin.from('users').upsert({id:account.id,auth_user_id:account.id,organization_id:callerAccess.organization_id,email:targetEmail.toLowerCase()",
                  "admin.from('users').upsert({id:account.id,auth_user_id:account.id,organization_id:callerOrganizationId,email:targetEmail.toLowerCase()",
                  'generator profile organization capture',
              ),
          ]
          for before, after, label in generator_replacements:
              generator = replace_once(generator, before, after, label)
          generator_path.write_text(generator)

          tenant_test_path = Path('onboarding-tenant-boundary.test.mjs')
          tenant_test = tenant_test_path.read_text()
          tenant_test = replace_once(
              tenant_test,
              "assert.match(repOnboarding,/\\.from\\('teams'\\)\\.select\\('id'\\)\\.eq\\('organization_id',callerAccess\\.organization_id\\)/)",
              "assert.match(repOnboarding,/\\.from\\('teams'\\)\\.select\\('id'\\)\\.eq\\('organization_id',callerOrganizationId\\)/)",
              'tenant test profile team stable organization capture',
          )
          tenant_test = replace_once(
              tenant_test,
              "assert.match(repOnboarding,/\\.from\\('users'\\)\\.upsert\\(\\{id:account\\.id,auth_user_id:account\\.id,organization_id:callerAccess\\.organization_id/)",
              "assert.match(repOnboarding,/\\.from\\('users'\\)\\.upsert\\(\\{id:account\\.id,auth_user_id:account\\.id,organization_id:callerOrganizationId/)",
              'tenant test profile stable organization capture',
          )
          assertion_marker = "  assert.match(repOnboarding,/requireOrganizationAccess\\('admin_controls'\\)/)"
          assertion_block = "  assert.match(repOnboarding,/requireOrganizationAccess\\('admin_controls'\\)/)\n  assert.match(repOnboarding,/const authUserId=user\\.id/)\n  assert.match(repOnboarding,/p_auth_user_id:authUserId/)\n  assert.match(repOnboarding,/const callerOrganizationId=callerAccess\\.organization_id/)"
          tenant_test = replace_once(
              tenant_test,
              assertion_marker,
              assertion_block,
              'tenant test stable narrowing assertions',
          )
          tenant_test_path.write_text(tenant_test)

          paywall_test_path = Path('paywall-phase2.test.mjs')
          paywall_test = paywall_test_path.read_text()
          paywall_test = replace_once(
              paywall_test,
              "assert.match(repOnboarding,/organization_id:callerAccess\\.organization_id,email:targetEmail\\.toLowerCase\\(\\)/)",
              "assert.match(repOnboarding,/organization_id:callerOrganizationId,email:targetEmail\\.toLowerCase\\(\\)/)",
              'paywall test profile stable organization capture',
          )
          paywall_test_path.write_text(paywall_test)
          PY

      - name: Verify only the proven mismatch was corrected
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-edge-paywall-guards.mjs
          deno check --node-modules-dir=auto supabase/functions/rep-onboarding/index.ts
          node --test \
            onboarding-membership-integrity.test.mjs \
            onboarding-tenant-boundary.test.mjs \
            import-pending-access-fix.test.mjs \
            paywall-phase2.test.mjs \
            paywall-deployment.test.mjs

      - name: Commit the verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix onboarding TypeScript nullability"
          git push origin HEAD:fix/atomic-onboarding-membership-20260902
