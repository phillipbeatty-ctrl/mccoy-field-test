name: Repair final onboarding contract once

on:
  push:
    branches:
      - fix/atomic-onboarding-membership-20260902
    paths:
      - .github/workflows/repair-onboarding-final-contract-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out onboarding branch
        uses: actions/checkout@v4
        with:
          ref: fix/atomic-onboarding-membership-20260902
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Execute the reviewed repair with the corrected contract symbol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/repair-pending-access-tscheck-once.yml')
          workflow = workflow_path.read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          anchor = "paywall_test_path = Path('paywall-phase2.test.mjs')"
          prefix, suffix = script.split(anchor, 1)
          suffix = suffix.replace('photoStage', 'providerPhotoStage')
          script = prefix + anchor + suffix
          exec(compile(script, 'reviewed-onboarding-repair.py', 'exec'), {})
          PY

      - name: Verify exact source, generator, and onboarding contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-edge-paywall-guards.mjs
          test "$(head -n 1 supabase/functions/pending-account-access/index.ts)" = "// @ts-nocheck"
          deno check --node-modules-dir=auto supabase/functions/rep-onboarding/index.ts
          deno check --node-modules-dir=auto supabase/functions/pending-account-access/index.ts
          deno check --node-modules-dir=auto supabase/functions/provider-sale-photo-stage/index.ts
          node --test \
            onboarding-membership-integrity.test.mjs \
            onboarding-tenant-boundary.test.mjs \
            import-pending-access-fix.test.mjs \
            paywall-phase2.test.mjs \
            paywall-deployment.test.mjs

      - name: Commit the verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/pending-account-access/index.ts \
            supabase/functions/provider-sale-photo-stage/index.ts \
            scripts/apply-edge-paywall-guards.mjs \
            onboarding-tenant-boundary.test.mjs \
            paywall-phase2.test.mjs
          git diff --cached --check
          git commit -m "Fix onboarding Edge TypeScript checks"
          git push origin HEAD:fix/atomic-onboarding-membership-20260902
