name: Harden Live Feed COMPANY and TEAM preview once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/scripts/harden-live-feed-company-team.py
      - .github/workflows/harden-live-feed-company-team-once.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Apply narrow review and scope-round-trip fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/harden-live-feed-company-team.py
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          node --test --test-reporter=spec live-feed-comments-contract.test.mjs
          grep -q "from auth.users auth_user" supabase/migrations/20260903062000_live_feed_comments_vertical_slice.sql
          grep -q "auth_email_mismatch" supabase/migrations/20260903062000_live_feed_comments_vertical_slice.sql
          grep -q "state.generation+=1" app-live-feed.js
          grep -q "function refreshAuthorization" app-live-feed.js
          grep -q 'return `${scope}:${scopeId||'"'"''"'"'}`' app-live-feed.js
          grep -q "stale JWT retained Live Feed access" supabase/tests/live-feed-comments-preview-canary.sql

      - name: Commit hardened preview and remove one-time scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/harden-live-feed-company-team.py
          rm -f .github/workflows/harden-live-feed-company-team-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden Live Feed scope switching and identity isolation'
          git push origin HEAD:preview/live-feed-comments-20260903
