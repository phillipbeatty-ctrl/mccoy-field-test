name: Finish Live Feed permission refresh and post scope once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/scripts/finish-live-feed-refresh-and-post-scope.py
      - .github/workflows/finish-live-feed-refresh-and-post-scope-once.yml

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Apply and verify final permission-refresh fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finish-live-feed-refresh-and-post-scope.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('live-feed-comments-contract.test.mjs')
          source=path.read_text(encoding='utf-8')
          old=r"assert.match(client,/if\(state\.loading\)\{state\.reloadQueued=true;return;\}/)"
          new=r"assert.match(client,/if\(state\.loading\)\{state\.reloadQueued=true;return false;\}/)"
          if source.count(old)!=1:
              raise SystemExit(f'expected one queued-load assertion, found {source.count(old)}')
          path.write_text(source.replace(old,new,1),encoding='utf-8')
          PY
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          node --test --test-reporter=spec live-feed-comments-contract.test.mjs
          node --test --test-reporter=spec sale-completion-runtime.test.mjs
          node --test --test-reporter=spec customer-list-stable-actions.test.mjs
          node --test --test-reporter=spec organization-access-gate.test.mjs
          node --test --test-reporter=spec app-update-recovery.test.mjs
          grep -q "select.disabled=!state.context||!state.authorizationReady||state.authorizationRefreshing||state.loading||state.posting" app-live-feed.js
          grep -q "Hide all previously authorized content before waiting on the new permission snapshot" app-live-feed.js
          grep -q "const loaded=await loadFeed({scope:state.selectedScope,scopeId:state.selectedScopeId,quiet:true})" app-live-feed.js

      - name: Commit verified fixes and remove one-time scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/finish-live-feed-refresh-and-post-scope.py
          rm -f .github/workflows/finish-live-feed-refresh-and-post-scope-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Hide stale Live Feed state during permission refresh'
          git push origin HEAD:preview/live-feed-comments-20260903
