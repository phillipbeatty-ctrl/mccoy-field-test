name: Field Coach Android Beta 5 Sale Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - fix/sale-completion-runtime-20260902
    paths:
      - '.github/workflows/field-coach-android-beta5-sale-runtime.yml'

permissions:
  contents: write

concurrency:
  group: field-coach-android-beta5-sale-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.0-beta.5
  ANDROID_BUILD_TOOLS: 36.0.0
  EXPECTED_SIGNER_SHA256: a3e8ca1f490053c2b38f1fc85c629fbefce2e8782e0dd4b03f55eb942f6df935

jobs:
  publish-beta5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out exact beta 5 source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install pinned dependencies
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check -r scripts/field-coach-icons-requirements.txt

      - name: Verify beta 5 source identity and sale runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" = "${APP_VERSION}"
          test "$(tr -d '\r\n' < VERSION)" = '1.0.0-beta.5+5'
          python3 scripts/apply-field-coach-icon-links.py
          npm run icons:source:verify | tee approved-logo-source-evidence.json
          npm run icons:generate
          npm run icons:verify | tee icon-source-evidence.jsonl
          node --test \
            sale-completion-runtime.test.mjs \
            sale-button-provider-capture.test.mjs \
            sales-hub-production-photo-closest.test.mjs \
            capture-only-sale-outcome.test.mjs \
            app-update-recovery.test.mjs
          npm run test:mobile

      - name: Generate beta 5 bundled web assets and Android project
        run: npm run mobile:android:prepare

      - name: Verify repaired scripts in the generated native web bundle
        shell: bash
        run: |
          set -euo pipefail
          for file in app-supabase-client.js app-sale-lifecycle.js app-sale-photo-staging.js app-sales.js; do
            test -s "mobile-web/${file}"
          done
          grep -q 'app-supabase-client.js?v=2026090201' mobile-web/index.html
          grep -q 'app-sale-lifecycle.js?v=2026090201' mobile-web/index.html
          grep -q 'app-sale-photo-staging.js?v=2026090201' mobile-web/index.html
          grep -q 'MCCOY_GET_SUPABASE_CLIENT' mobile-web/app-supabase-client.js
          grep -q 'MCCOY_GET_SUPABASE_CLIENT' mobile-web/app-sale-lifecycle.js
          grep -q 'MCCOY_REQUIRE_SUPABASE_CLIENT' mobile-web/app-sale-photo-staging.js
          grep -q "sb.functions.invoke('sale-submit'" mobile-web/app-sales.js
          ! grep -q 'mccoyCaptureValidated' mobile-web/app-sale-lifecycle.js
          ! grep -Fq 'window.sb?.' mobile-web/app-sale-lifecycle.js
          ! grep -Fq 'window.sb?.' mobile-web/app-sale-photo-staging.js
          grep -q 'field-coach-app-shell-v7-20260902-sale-completion-runtime' mobile-web/service-worker.js

      - name: Verify generated Android launcher resources and release doctor
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t launchers < <(find android/app/src/main/res -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_foreground.png' \) | sort)
          test "${#launchers[@]}" -gt 0
          node scripts/verify-png-content.mjs "${launchers[@]}" | tee generated-launcher-evidence.jsonl
          npm run mobile:doctor

      - name: Retrieve the persistent internal signing key
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://athxxrfqxwlfnuvbqadp.supabase.co
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          umask 077
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/get_field_coach_android_internal_signing_v1" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output /tmp/field-coach-signing.json

          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          response = json.loads(Path('/tmp/field-coach-signing.json').read_text(encoding='utf-8'))
          if isinstance(response, str):
              response = json.loads(response)
          if not isinstance(response, dict):
              raise SystemExit('Signing RPC returned an unexpected payload type')

          required = {
              'keystore_base64',
              'store_password',
              'key_alias',
              'key_password',
              'certificate_sha256',
              'keystore_sha256',
              'version',
          }
          missing = sorted(required.difference(response))
          if missing:
              raise SystemExit(f'Signing payload is incomplete: {missing}')
          if response['version'] != 1:
              raise SystemExit(f"Unsupported signing payload version: {response['version']}")

          alias = str(response['key_alias'])
          store_password = str(response['store_password'])
          key_password = str(response['key_password'])
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}', alias):
              raise SystemExit('Signing alias contains unsupported characters')
          if any(character in store_password + key_password for character in '\r\n\0'):
              raise SystemExit('Signing password contains an unsupported control character')

          expected_cert = os.environ['EXPECTED_SIGNER_SHA256'].lower()
          payload_cert = str(response['certificate_sha256']).replace(':', '').lower()
          if payload_cert != expected_cert:
              raise SystemExit(f'Unexpected signing certificate fingerprint: {payload_cert}')

          keystore = base64.b64decode(str(response['keystore_base64']), validate=True)
          expected_keystore = str(response['keystore_sha256']).lower()
          actual_keystore = hashlib.sha256(keystore).hexdigest()
          if actual_keystore != expected_keystore:
              raise SystemExit(f'Keystore checksum mismatch: {actual_keystore}')

          keystore_path = Path('/tmp/field-coach-internal.p12')
          keystore_path.write_bytes(keystore)
          keystore_path.chmod(0o600)

          print(f'::add-mask::{store_password}')
          print(f'::add-mask::{key_password}')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env_file:
              env_file.write(f'FIELD_COACH_KEYSTORE_PATH={keystore_path}\n')
              env_file.write(f'FIELD_COACH_KEY_ALIAS={alias}\n')
              env_file.write(f'FIELD_COACH_STORE_PASSWORD={store_password}\n')
              env_file.write(f'FIELD_COACH_KEY_PASSWORD={key_password}\n')
              env_file.write(f'FIELD_COACH_CERT_SHA256={payload_cert}\n')
              env_file.write(f'FIELD_COACH_KEYSTORE_SHA256={actual_keystore}\n')
          PY

          rm -f /tmp/field-coach-signing.json

      - name: Verify persistent certificate and beta 4 update lineage
        shell: bash
        run: |
          set -euo pipefail
          keytool -exportcert \
            -keystore "${FIELD_COACH_KEYSTORE_PATH}" \
            -storetype PKCS12 \
            -storepass "${FIELD_COACH_STORE_PASSWORD}" \
            -alias "${FIELD_COACH_KEY_ALIAS}" \
            > /tmp/field-coach-signing-cert.der
          actual="$(sha256sum /tmp/field-coach-signing-cert.der | awk '{print $1}')"
          test "${actual}" = "${EXPECTED_SIGNER_SHA256}"
          test "${actual}" = "${FIELD_COACH_CERT_SHA256}"

          beta4='downloads/Field-Coach-Android-1.0.0-beta.4-internal.apk'
          test -s "${beta4}"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "${beta4}" > /tmp/beta4-signing.txt
          beta4_signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/beta4-signing.txt | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "${beta4_signer}" = "${EXPECTED_SIGNER_SHA256}"
          echo "Verified beta 4 to beta 5 signer continuity: ${actual}."

      - name: Compile unsigned beta 5 APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Sign, verify, inspect, and package beta 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist downloads /tmp/field-coach-apk-icons /tmp/field-coach-apk-runtime

          unsigned_apk='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          unsigned_aab='android/app/build/outputs/bundle/release/app-release.aab'
          aligned_apk='/tmp/field-coach-release-aligned.apk'
          apk="dist/Field-Coach-Android-${APP_VERSION}-internal.apk"
          aab="dist/Field-Coach-Android-${APP_VERSION}-internal.aab"

          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -p -f 4 "${unsigned_apk}" "${aligned_apk}"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
            --ks "${FIELD_COACH_KEYSTORE_PATH}" \
            --ks-type PKCS12 \
            --ks-key-alias "${FIELD_COACH_KEY_ALIAS}" \
            --ks-pass env:FIELD_COACH_STORE_PASSWORD \
            --key-pass env:FIELD_COACH_KEY_PASSWORD \
            --out "${apk}" \
            "${aligned_apk}"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify \
            --verbose \
            --print-certs \
            "${apk}" | tee dist/apk-signing.txt

          actual_signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apk-signing.txt | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "${actual_signer}" = "${EXPECTED_SIGNER_SHA256}"
          test "$(grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' dist/apk-signing.txt)" -eq 1
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true' dist/apk-signing.txt
          grep -q '^Verified using v3 scheme (APK Signature Scheme v3): true' dist/apk-signing.txt

          cp "${unsigned_aab}" "${aab}"
          jarsigner \
            -keystore "${FIELD_COACH_KEYSTORE_PATH}" \
            -storetype PKCS12 \
            -storepass "${FIELD_COACH_STORE_PASSWORD}" \
            -keypass "${FIELD_COACH_KEY_PASSWORD}" \
            -digestalg SHA-256 \
            -sigalg SHA256withRSA \
            "${aab}" \
            "${FIELD_COACH_KEY_ALIAS}" >/tmp/field-coach-jarsigner.txt
          jarsigner -verify -verbose -certs "${aab}" | tee dist/aab-signing.txt
          grep -q 'jar verified\.' dist/aab-signing.txt

          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "${apk}" > dist/apk-badging.txt
          grep -q "package: name='com.mccoyplatform.app'" dist/apk-badging.txt
          grep -q "versionCode='5'" dist/apk-badging.txt
          grep -q "versionName='1.0.0-beta.5'" dist/apk-badging.txt
          grep -q "application-label:'Field Coach'" dist/apk-badging.txt
          grep -q "targetSdkVersion:'36'" dist/apk-badging.txt

          for file in app-supabase-client.js app-sale-lifecycle.js app-sale-photo-staging.js app-sales.js service-worker.js; do
            entry="$(unzip -Z1 "${apk}" | grep -E "(^|/)${file}$" | head -n1)"
            test -n "${entry}"
            unzip -p "${apk}" "${entry}" > "/tmp/field-coach-apk-runtime/${file}"
            test -s "/tmp/field-coach-apk-runtime/${file}"
          done
          grep -q 'MCCOY_GET_SUPABASE_CLIENT' /tmp/field-coach-apk-runtime/app-supabase-client.js
          grep -q 'MCCOY_GET_SUPABASE_CLIENT' /tmp/field-coach-apk-runtime/app-sale-lifecycle.js
          grep -q 'MCCOY_REQUIRE_SUPABASE_CLIENT' /tmp/field-coach-apk-runtime/app-sale-photo-staging.js
          grep -q "sb.functions.invoke('sale-submit'" /tmp/field-coach-apk-runtime/app-sales.js
          ! grep -q 'mccoyCaptureValidated' /tmp/field-coach-apk-runtime/app-sale-lifecycle.js
          grep -q 'field-coach-app-shell-v7-20260902-sale-completion-runtime' /tmp/field-coach-apk-runtime/service-worker.js

          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" dump resources "${apk}" > /tmp/field-coach-apk-resources.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          resource_dump = Path('/tmp/field-coach-apk-resources.txt').read_text(encoding='utf-8')
          resource_line = re.compile(r'^\s*resource\s+\S+\s+mipmap/(\S+)\s*$')
          packaged_file = re.compile(r'^\s*\([^)]+\)\s+\(file\)\s+(res/\S+\.png)\s+type=PNG\s*$')
          launchers = {'ic_launcher', 'ic_launcher_foreground', 'ic_launcher_round'}
          current_is_launcher = False
          entries = []
          for line in resource_dump.splitlines():
              resource_match = resource_line.match(line)
              if resource_match:
                  current_is_launcher = resource_match.group(1) in launchers
                  continue
              if current_is_launcher:
                  file_match = packaged_file.match(line)
                  if file_match:
                      entries.append(file_match.group(1))
          entries = sorted(set(entries))
          if not entries:
              raise SystemExit('No packaged launcher PNGs were resolved from the compiled resource table.')
          Path('/tmp/field-coach-apk-launcher-entries.txt').write_text(
              ''.join(f'{entry}\n' for entry in entries),
              encoding='utf-8',
          )
          print(f'Resolved {len(entries)} packaged launcher PNGs from the compiled resource table.')
          PY
          mapfile -t packaged_entries < /tmp/field-coach-apk-launcher-entries.txt
          index=0
          for entry in "${packaged_entries[@]}"; do
            index=$((index+1))
            target="/tmp/field-coach-apk-icons/$(printf '%03d' "${index}")-$(basename "${entry}")"
            unzip -p "${apk}" "${entry}" > "${target}"
            test -s "${target}"
          done
          mapfile -t packaged_icons < <(find /tmp/field-coach-apk-icons -type f -name '*.png' | sort)
          test "${#packaged_icons[@]}" -gt 0
          node scripts/verify-png-content.mjs "${packaged_icons[@]}" | tee dist/apk-launcher-evidence.jsonl

          cp mobile-release-doctor.json dist/mobile-release-doctor.json
          cp mobile-web/mobile-build.json dist/mobile-build.json
          cp approved-logo-source-evidence.json icon-source-evidence.jsonl generated-launcher-evidence.jsonl dist/
          cat > dist/internal-signing.json <<JSON
          {
            "schema_version": 1,
            "product": "Field Coach",
            "version": "${APP_VERSION}",
            "application_id": "com.mccoyplatform.app",
            "key_alias": "${FIELD_COACH_KEY_ALIAS}",
            "certificate_sha256": "${EXPECTED_SIGNER_SHA256}",
            "keystore_sha256": "${FIELD_COACH_KEYSTORE_SHA256}",
            "custody": "Supabase Vault; service_role-only retrieval in protected GitHub production environment",
            "beta3_update_compatible": false,
            "beta4_update_compatible": true,
            "clean_install_required_from_beta3": true,
            "clean_install_required": false
          }
          JSON

          (cd dist && sha256sum \
            "Field-Coach-Android-${APP_VERSION}-internal.apk" \
            "Field-Coach-Android-${APP_VERSION}-internal.aab" \
            apk-badging.txt \
            apk-signing.txt \
            aab-signing.txt \
            mobile-build.json \
            mobile-release-doctor.json \
            approved-logo-source-evidence.json \
            icon-source-evidence.jsonl \
            generated-launcher-evidence.jsonl \
            apk-launcher-evidence.jsonl \
            internal-signing.json \
            > SHA256SUMS.txt)

          cp "${apk}" "downloads/Field-Coach-Android-${APP_VERSION}-internal.apk"
          sha256sum "downloads/Field-Coach-Android-${APP_VERSION}-internal.apk" \
            > "downloads/Field-Coach-Android-${APP_VERSION}-internal.apk.sha256"

          # Keep a byte-identical compatibility alias for controlled download checks.
          cp "${apk}" "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk"
          sha256sum "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk" \
            > "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk.sha256"
          cmp \
            "downloads/Field-Coach-Android-${APP_VERSION}-internal.apk" \
            "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk"

      - name: Publish signed beta 5 into the release PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add assets/*.png download.html APP_RELEASE.md VERSION package.json capacitor.config.json
          git add -f \
            "downloads/Field-Coach-Android-${APP_VERSION}-internal.apk" \
            "downloads/Field-Coach-Android-${APP_VERSION}-internal.apk.sha256" \
            "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk" \
            "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk.sha256"
          if git diff --cached --quiet; then
            echo 'Signed Android beta 5 and approved icons are already current.'
            exit 0
          fi
          git commit -m 'Publish persistently signed Field Coach beta 5 [android-beta5-sale-runtime-generated]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload signed Field Coach beta 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: Field-Coach-Android-1.0.0-beta.5-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/field-coach-internal.p12
          rm -f /tmp/field-coach-signing-cert.der
          rm -f /tmp/field-coach-jarsigner.txt
          rm -f /tmp/field-coach-signing.json
          rm -rf /tmp/field-coach-apk-icons /tmp/field-coach-apk-runtime
