name: Materialize approved Field Coach logo source v2

on:
  workflow_dispatch:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.github/workflows/materialize-approved-field-coach-logo-v2.yml'

permissions:
  contents: write

concurrency:
  group: approved-field-coach-logo-source-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-approved-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out correction branch and repository history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned image library
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Recover only bytes equal to the approved upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import re
          import subprocess
          from pathlib import Path

          from PIL import Image, ImageChops

          ROOT = Path.cwd()
          BRAND = ROOT / "assets" / "brand"
          BRAND.mkdir(parents=True, exist_ok=True)

          HISTORICAL_COMMIT = "7d93fa2fb628a4d2c08cb6e2674334c23080e272"
          EXPECTED_JPEG = "227203e1c0ab14a1aa400e6f0d1411a6512222a685589df92dac3f3c1633cd90"
          EXPECTED_PNG = "ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5"

          svg = subprocess.check_output(
              ["git", "show", f"{HISTORICAL_COMMIT}:assets/logo.svg"],
              cwd=ROOT,
          )
          matches = re.findall(
              rb"data:image/(?:jpeg|jpg);base64,([^\"']+)",
              svg,
              flags=re.IGNORECASE,
          )
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one embedded JPEG in historical evidence; found {len(matches)}"
              )

          encoded = re.sub(rb"\s+", b"", matches[0])
          original_bytes = base64.b64decode(encoded, validate=True)
          original_digest = hashlib.sha256(original_bytes).hexdigest()
          if original_digest != EXPECTED_JPEG:
              raise SystemExit(
                  "Historical evidence is not the newly approved upload: "
                  f"expected {EXPECTED_JPEG}, received {original_digest}"
              )

          original_path = BRAND / "approved-upload-original.jpg"
          source_path = BRAND / "official-logo-source.png"
          original_path.write_bytes(original_bytes)

          with Image.open(io.BytesIO(original_bytes)) as image:
              image.load()
              approved = image.convert("RGB")
              if approved.size != (1024, 1024):
                  raise SystemExit(f"Approved upload dimensions changed: {approved.size}")
              approved.save(source_path, format="PNG", optimize=True, compress_level=9)

          source_digest = hashlib.sha256(source_path.read_bytes()).hexdigest()
          if source_digest != EXPECTED_PNG:
              raise SystemExit(
                  "Normalized source differs from the reviewed PNG conversion: "
                  f"expected {EXPECTED_PNG}, received {source_digest}"
              )

          with Image.open(original_path) as original, Image.open(source_path) as normalized:
              original_rgb = original.convert("RGB")
              normalized_rgb = normalized.convert("RGB")
              if original_rgb.size != normalized_rgb.size:
                  raise SystemExit("Approved JPEG and normalized PNG dimensions differ")
              if ImageChops.difference(original_rgb, normalized_rgb).getbbox() is not None:
                  raise SystemExit("Approved JPEG and normalized PNG decoded pixels differ")

          (BRAND / "official-logo-source.sha256").write_text(
              f"{source_digest}  assets/brand/official-logo-source.png\n",
              encoding="utf-8",
          )
          print(
              {
                  "approved_upload_sha256": original_digest,
                  "normalized_png_sha256": source_digest,
                  "dimensions": [1024, 1024],
                  "pixel_identical": True,
              }
          )
          PY

      - name: Commit immutable source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add assets/brand/approved-upload-original.jpg \
                  assets/brand/official-logo-source.png \
                  assets/brand/official-logo-source.sha256
          if git diff --cached --quiet; then
            echo 'Approved source files are already current.'
            exit 0
          fi
          git commit -m 'Materialize checksum-verified approved logo source [approved-logo-source]'
          git push origin HEAD:${GITHUB_REF_NAME}
