name: Repair Customer List workflow check once

on:
  push:
    branches:
      - fix/customer-list-stable-sale-actions-20260902
    paths:
      - .github/workflows/repair-customer-list-workflow-check-once.yml

permissions:
  contents: write

jobs:
  repair-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/customer-list-stable-sale-actions-20260902
          fetch-depth: 0
      - name: Remove unrelated global Edge inventory check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/fix-customer-list-stable-actions-once.yml')
          source=path.read_text()
          marker='          node scripts/apply-edge-paywall-guards.mjs\n'
          if source.count(marker)!=1:
              raise SystemExit('expected generator-check marker once')
          path.write_text(source.replace(marker,'',1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-customer-list-stable-actions-once.yml
          git diff --cached --check
          git commit -m "Limit Customer List repair verification to affected surface"
          git push origin HEAD:fix/customer-list-stable-sale-actions-20260902
