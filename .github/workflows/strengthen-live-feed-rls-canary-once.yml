name: Strengthen Live Feed authenticated RLS canary once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/scripts/strengthen-live-feed-rls-canary.py
      - .github/workflows/strengthen-live-feed-rls-canary-once.yml

permissions:
  contents: write

jobs:
  strengthen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Apply and verify authenticated-role RLS assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/strengthen-live-feed-rls-canary.py
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          node --test --test-reporter=spec live-feed-comments-contract.test.mjs
          node --test --test-reporter=spec sale-completion-runtime.test.mjs
          node --test --test-reporter=spec customer-list-stable-actions.test.mjs
          node --test --test-reporter=spec organization-access-gate.test.mjs
          node --test --test-reporter=spec app-update-recovery.test.mjs
          test "$(grep -c 'set local role authenticated;' supabase/tests/live-feed-comments-preview-canary.sql)" -ge 5
          test "$(grep -c 'reset role;' supabase/tests/live-feed-comments-preview-canary.sql)" -ge 5
          grep -q 'pending team comment bypassed RLS for another team member' supabase/tests/live-feed-comments-preview-canary.sql
          grep -q 'organization A comment rows leaked to organization B through authenticated RLS' supabase/tests/live-feed-comments-preview-canary.sql

      - name: Commit verified canary fix and remove one-time scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/strengthen-live-feed-rls-canary.py
          rm -f .github/workflows/strengthen-live-feed-rls-canary-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Exercise Live Feed RLS under authenticated role'
          git push origin HEAD:preview/live-feed-comments-20260903
