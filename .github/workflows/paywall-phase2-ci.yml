name: Paywall Phase 2 and Web App Release

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/paywall-targets.mjs'
      - 'scripts/apply-edge-paywall-guards.mjs'
      - 'scripts/build-webapp-download.mjs'
      - 'organization-access-gate.test.mjs'
      - 'paywall-phase2.test.mjs'
      - 'paywall-deployment.test.mjs'
      - 'webapp-download.test.mjs'
      - 'ios-install.html'
      - 'webapp-download.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - '.github/workflows/paywall-phase2-ci.yml'
      - '.github/workflows/deploy-paywall-phase2.yml'
      - '.github/workflows/field-coach-webapp-download.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/paywall-targets.mjs'
      - 'scripts/apply-edge-paywall-guards.mjs'
      - 'scripts/build-webapp-download.mjs'
      - 'organization-access-gate.test.mjs'
      - 'paywall-phase2.test.mjs'
      - 'paywall-deployment.test.mjs'
      - 'webapp-download.test.mjs'
      - 'ios-install.html'
      - 'webapp-download.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - '.github/workflows/paywall-phase2-ci.yml'
      - '.github/workflows/deploy-paywall-phase2.yml'
      - '.github/workflows/field-coach-webapp-download.yml'

permissions:
  contents: read

concurrency:
  group: paywall-phase2-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Detect whether paywall source changed
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${head}^"
          fi
          git diff --name-only "${base}" "${head}" | tee /tmp/field-coach-changed-files.txt
          if grep -Eq '^(supabase/functions/|supabase/migrations/|scripts/paywall-targets\.mjs$|scripts/apply-edge-paywall-guards\.mjs$|organization-access-gate\.test\.mjs$|paywall-phase2\.test\.mjs$|paywall-deployment\.test\.mjs$|\.github/workflows/deploy-paywall-phase2\.yml$)' /tmp/field-coach-changed-files.txt; then
            echo 'paywall_source_changed=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'paywall_source_changed=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Deno
        if: steps.scope.outputs.paywall_source_changed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify generated guards are committed
        if: steps.scope.outputs.paywall_source_changed == 'true'
        run: node scripts/apply-edge-paywall-guards.mjs

      - name: Run web release regression
        run: node --test webapp-download.test.mjs

      - name: Run paywall regressions
        if: steps.scope.outputs.paywall_source_changed == 'true'
        run: node --test organization-access-gate.test.mjs paywall-phase2.test.mjs paywall-deployment.test.mjs

      - name: Type-check the shared fail-closed guard
        if: steps.scope.outputs.paywall_source_changed == 'true'
        run: deno check --node-modules-dir=auto supabase/functions/_shared/organization-paywall.ts

      - name: Parse every protected Edge Function
        if: steps.scope.outputs.paywall_source_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          node -e "import('./scripts/paywall-targets.mjs').then(({edgePaywallTargets})=>console.log([...edgePaywallTargets.keys()].join('\n')))" | while IFS= read -r slug; do
            cp "supabase/functions/${slug}/index.ts" "$temp_dir/${slug}.ts"
            deno fmt "$temp_dir/${slug}.ts" >/dev/null
          done
