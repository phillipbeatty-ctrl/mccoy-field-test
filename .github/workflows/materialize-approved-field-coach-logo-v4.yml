name: Materialize approved Field Coach logo v4

on:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.logo-transport/READY'

permissions:
  contents: write

concurrency:
  group: materialize-approved-field-coach-logo-v4
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the correction branch
        uses: actions/checkout@v5
        with:
          ref: fix/approved-official-logo-beta4-20260901
          fetch-depth: 0

      - name: Reassemble and verify the temporary lossless transport
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .logo-transport -maxdepth 1 -type f -name 'official-logo-source.webp.b64.part*' | sort)
          test "${#parts[@]}" -eq 41
          for index in $(seq -w 0 39); do
            test "$(wc -c < ".logo-transport/official-logo-source.webp.b64.part${index}")" -eq 16000
          done
          test "$(wc -c < .logo-transport/official-logo-source.webp.b64.part40)" -eq 15796
          cat "${parts[@]}" > /tmp/official-logo-source.webp.b64
          echo 'c426110fe6d9fd5d385bc2db22ffe6e7f4f5b79af790425d477269407b18a35e  /tmp/official-logo-source.webp.b64' | sha256sum -c -
          base64 --decode /tmp/official-logo-source.webp.b64 > /tmp/official-logo-source.webp
          echo 'e312cb348953aeb404524c87ad6245b15881443d76be51f615927638f9ddd110  /tmp/official-logo-source.webp' | sha256sum -c -

      - name: Materialize the immutable authoritative PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          mkdir -p assets/brand
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image

          transport = Path('/tmp/official-logo-source.webp')
          target = Path('assets/brand/official-logo-source.png')
          expected = 'ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5'

          with Image.open(transport) as image:
              image.load()
              image = image.convert('RGB')
              if image.size != (1024, 1024):
                  raise SystemExit(f'Unexpected approved logo dimensions: {image.size}')
              image.save(target, format='PNG', optimize=True, compress_level=9)

          actual = sha256(target.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Approved PNG checksum mismatch: {actual}')
          target.with_suffix('.sha256').write_text(
              f'{expected}  assets/brand/official-logo-source.png\n',
              encoding='utf-8',
          )
          print({'source': str(target), 'sha256': actual, 'dimensions': [1024, 1024], 'mode': 'RGB'})
          PY

      - name: Install the PNG-only source contract
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/verify-approved-logo-source.py <<'PY'
          #!/usr/bin/env python3
          """Fail closed unless the authoritative Field Coach PNG matches its locked contract."""
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          from PIL import Image

          ROOT = Path(__file__).resolve().parents[1]
          BRAND = ROOT / "assets" / "brand"
          SOURCE = BRAND / "official-logo-source.png"
          CHECKSUM = BRAND / "official-logo-source.sha256"
          EXPECTED_SOURCE_SHA256 = "ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5"
          EXPECTED_SIZE = (1024, 1024)
          EXPECTED_FORMAT = "PNG"
          EXPECTED_MODE = "RGB"


          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def fail(message: str) -> None:
              raise SystemExit(f"Approved logo verification failed: {message}")


          def main() -> None:
              for path in (SOURCE, CHECKSUM):
                  if not path.is_file():
                      fail(f"missing {path.relative_to(ROOT)}")

              source_sha256 = sha256(SOURCE)
              if source_sha256 != EXPECTED_SOURCE_SHA256:
                  fail(f"authoritative PNG checksum changed: {source_sha256}")

              expected_checksum_line = (
                  f"{EXPECTED_SOURCE_SHA256}  assets/brand/official-logo-source.png"
              )
              checksum_line = CHECKSUM.read_text(encoding="utf-8").strip()
              if checksum_line != expected_checksum_line:
                  fail("official-logo-source.sha256 does not contain the locked source checksum")

              try:
                  with Image.open(SOURCE) as image:
                      image.verify()
                  with Image.open(SOURCE) as image:
                      image.load()
                      actual_format = image.format
                      actual_size = image.size
                      actual_mode = image.mode
              except Exception as error:
                  fail(f"authoritative PNG cannot be decoded: {error}")

              if actual_format != EXPECTED_FORMAT:
                  fail(f"source format changed: expected {EXPECTED_FORMAT}, received {actual_format}")
              if actual_size != EXPECTED_SIZE:
                  fail(
                      "source dimensions changed: "
                      f"expected {EXPECTED_SIZE[0]}x{EXPECTED_SIZE[1]}, "
                      f"received {actual_size[0]}x{actual_size[1]}"
                  )
              if actual_mode != EXPECTED_MODE:
                  fail(f"source color mode changed: expected {EXPECTED_MODE}, received {actual_mode}")

              print(json.dumps({
                  "ok": True,
                  "authoritative_source": str(SOURCE.relative_to(ROOT)),
                  "sha256": source_sha256,
                  "format": actual_format,
                  "dimensions": list(actual_size),
                  "mode": actual_mode,
                  "jpeg_runtime_dependency": False,
              }, sort_keys=True))


          if __name__ == "__main__":
              main()
          PY
          chmod +x scripts/verify-approved-logo-source.py

          cat > assets/brand/logo-usage.md <<'MD'
          # Field Coach logo usage

          ## Authoritative source

          `assets/brand/official-logo-source.png` is the immutable repository source for all Field Coach artwork.

          - Format: PNG
          - Dimensions: 1024 x 1024
          - Color mode: RGB
          - SHA-256: `ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5`

          The PNG is a direct, non-redesigned conversion of the owner-approved uploaded image. The historical JPEG and temporary lossless transport are provenance evidence only; neither is a build-time dependency.

          ## Rules

          1. Do not redraw, vectorize, recolor, regenerate, retouch, crop, or restyle the approved artwork.
          2. Browser, PWA, Android, iPhone, iPad, launcher, and splash assets must be deterministic scale-and-padding derivatives of the authoritative PNG.
          3. Any source change requires explicit owner approval and a deliberate checksum update.
          4. CI must verify checksum, format, color mode, and dimensions before generating derivatives.
          5. `assets/logo.svg` is historical compatibility material, not an approved source.
          6. Platform-safe padding is allowed; removing approved content is not.

          ## Verification surfaces

          Before production promotion, verify the browser favicon, login branding, installation pages, PWA manifest, Apple Home Screen icon, Android generated and APK-extracted launcher resources, and Android splash screen.
          MD

      - name: Generate and verify every deterministic derivative
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          python3 scripts/verify-approved-logo-source.py | tee approved-logo-source-evidence.json
          python3 scripts/generate-field-coach-icons.py
          node scripts/verify-png-content.mjs \
            assets/favicon-64.png \
            assets/apple-touch-icon-180.png \
            assets/icon-192.png \
            assets/icon-512.png \
            assets/icon-maskable-512.png \
            assets/icon-only.png \
            assets/icon-foreground.png
          node --test mobile-release.test.mjs

      - name: Remove obsolete transports and commit the verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .logo-transport .bootstrap assets/brand/source-staging
          rm -f assets/brand/approved-upload-original.jpg
          rm -f .github/workflows/bootstrap-approved-logo-beta4.yml
          rm -f .github/workflows/bootstrap-approved-logo-beta4-v2.yml
          rm -f .github/workflows/diagnose-logo-transport.yml
          rm -f .github/workflows/finalize-approved-field-coach-beta4.yml
          rm -f .github/workflows/finalize-approved-field-coach-beta4-v2.yml
          rm -f .github/workflows/materialize-approved-field-coach-logo.yml
          rm -f .github/workflows/materialize-approved-field-coach-logo-v2.yml
          rm -f .github/workflows/materialize-approved-field-coach-logo-v3.yml
          rm -f .github/workflows/reconcile-approved-field-coach-beta4.yml
          rm -f .github/workflows/materialize-approved-field-coach-logo-v4.yml

          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Commit checksum-locked approved Field Coach logo source [approved-logo-source-materialized]'
          git push origin HEAD:fix/approved-official-logo-beta4-20260901
