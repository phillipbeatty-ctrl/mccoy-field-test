name: Fix Live Feed preview review findings once

on:
  push:
    branches:
      - preview/live-feed-comments-20260903
    paths:
      - .github/workflows/fix-live-feed-preview-review-once.yml

permissions:
  contents: write

jobs:
  repair-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v5
        with:
          ref: preview/live-feed-comments-20260903
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply the narrow review fixes
        run: python3 .github/scripts/fix-live-feed-review-findings.py

      - name: Verify Live Feed preview contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check app-live-feed.js
          node --check app-live-wins.js
          node --check service-worker.js
          node --test live-feed-comments-contract.test.mjs
          git diff --check

      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app-live-feed.js \
            live-feed-comments-contract.test.mjs \
            supabase/migrations/20260903062000_live_feed_comments_vertical_slice.sql
          git diff --cached --check
          git commit -m "Harden Live Feed preview retries and expiry"
          git push origin HEAD:preview/live-feed-comments-20260903
