name: Temporary encrypted SPOTIO recovery relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: temporary-spotio-recovery-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.comment.body == 'MCCOY_SPOTIO_PAYLOAD_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_RECORDS: '15538'
      EXPECTED_PAYLOAD_SHA: 8ec3412e3076e2df2315d5b1c6a3786ca6628b1eb8b734a0ae02e6a9d51a0861
      RECOVERY_URL: https://athxxrfqxwlfnuvbqadp.supabase.co/functions/v1/spotio-recovery-exact
    steps:
      - name: Reconstruct encrypted payload and stream production upserts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request

          repo = os.environ['GH_REPOSITORY']
          issue = os.environ['GH_ISSUE']
          gh_token = os.environ['GH_TOKEN']
          expected_records = int(os.environ['EXPECTED_RECORDS'])
          expected_payload_sha = os.environ['EXPECTED_PAYLOAD_SHA']
          recovery_url = os.environ['RECOVERY_URL']

          def request_json(url, *, method='GET', data=None, headers=None, attempts=4, timeout=300):
              merged = {'Accept': 'application/vnd.github+json', 'User-Agent': 'mccoy-spotio-recovery'}
              if headers:
                  merged.update(headers)
              body = None
              if data is not None:
                  body = json.dumps(data, separators=(',', ':')).encode()
                  merged['Content-Type'] = 'application/json'
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, data=body, method=method, headers=merged)
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode())
                  except Exception as error:
                      last = error
                      if attempt == attempts:
                          raise
                      time.sleep(attempt * 2)
              raise last

          comments = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100&page={page}'
              batch = request_json(url, headers={'Authorization': f'Bearer {gh_token}'})
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          pattern = re.compile(r'^MCCOY_PAYLOAD_CHUNK\s+(\d{3})/(\d{3})\n([A-Za-z0-9+/=\n\r]+)$')
          pieces = {}
          total = None
          for comment in comments:
              match = pattern.match(str(comment.get('body') or '').strip())
              if not match:
                  continue
              index = int(match.group(1))
              declared_total = int(match.group(2))
              if total is None:
                  total = declared_total
              if total != declared_total:
                  raise RuntimeError('payload chunk total mismatch')
              pieces[index] = re.sub(r'\s+', '', match.group(3))

          if total is None or len(pieces) != total or set(pieces) != set(range(total)):
              raise RuntimeError(f'payload incomplete: expected {total}, found {len(pieces)}')
          encoded = ''.join(pieces[index] for index in range(total))
          payload_sha = hashlib.sha256(encoded.encode()).hexdigest()
          if payload_sha != expected_payload_sha:
              raise RuntimeError(f'payload hash mismatch: {payload_sha}')

          progress = []
          for offset in range(0, expected_records, 500):
              result = request_json(
                  recovery_url,
                  method='POST',
                  data={'action': 'chunk', 'offset': offset, 'encoded': encoded},
                  timeout=300,
              )
              if not result.get('ok'):
                  raise RuntimeError(f'chunk {offset} failed: {result}')
              progress.append(result)
              print(json.dumps({
                  'processed': result.get('processed'),
                  'expected': result.get('expected'),
                  'chunk': result.get('chunk'),
                  'totals': result.get('totals'),
              }, separators=(',', ':')))

          final = request_json(recovery_url, method='POST', data={'action': 'finalize'}, timeout=300)
          if not final.get('ok'):
              raise RuntimeError(f'finalize failed: {final}')

          status = request_json(recovery_url, method='POST', data={'action': 'status'}, timeout=300)
          geocode_runs = []
          for _ in range(8):
              if int(status.get('batch_unmapped_leads') or 0) <= 0:
                  break
              geocode = request_json(recovery_url, method='POST', data={'action': 'geocode_missing', 'limit': 25}, timeout=300)
              if not geocode.get('ok'):
                  raise RuntimeError(f'geocode failed: {geocode}')
              geocode_runs.append(geocode)
              status = request_json(recovery_url, method='POST', data={'action': 'status'}, timeout=300)

          batch = status.get('batch') or {}
          accepted = int(batch.get('created_count') or 0) + int(batch.get('updated_count') or 0) + int(batch.get('unchanged_count') or 0)
          if accepted != expected_records:
              raise RuntimeError(f'accepted count mismatch: {accepted} != {expected_records}')
          if int(batch.get('collision_count') or 0) or int(batch.get('quarantined_count') or 0):
              raise RuntimeError(f'unsafe import outcomes: {batch}')

          report = {
              'ok': True,
              'expected_records': expected_records,
              'accepted': accepted,
              'created': int(batch.get('created_count') or 0),
              'updated': int(batch.get('updated_count') or 0),
              'unchanged': int(batch.get('unchanged_count') or 0),
              'collisions': int(batch.get('collision_count') or 0),
              'quarantined': int(batch.get('quarantined_count') or 0),
              'active_non_demo': int(status.get('active_non_demo') or 0),
              'batch_active_leads': int(status.get('batch_active_leads') or 0),
              'batch_mapped_leads': int(status.get('batch_mapped_leads') or 0),
              'batch_unmapped_leads': int(status.get('batch_unmapped_leads') or 0),
              'active_with_provider_id': int(status.get('active_with_provider_id') or 0),
              'batch_id': batch.get('id'),
              'geocode_runs': geocode_runs,
          }
          with open('/tmp/spotio-recovery-result.json', 'w') as file:
              json.dump(report, file, indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## SPOTIO two-file production recovery\n\n')
              for key, value in report.items():
                  if key != 'geocode_runs':
                      summary.write(f'- **{key}:** `{value}`\n')
          print(json.dumps(report, indent=2))

          comment_body = (
              'MCCOY_SPOTIO_RECOVERY_COMPLETE\n\n'
              f"- Accepted: **{report['accepted']:,}** / **{expected_records:,}**\n"
              f"- Created: **{report['created']:,}**\n"
              f"- Updated: **{report['updated']:,}**\n"
              f"- Unchanged: **{report['unchanged']:,}**\n"
              f"- Active non-demo Lead Pool: **{report['active_non_demo']:,}**\n"
              f"- Batch records active: **{report['batch_active_leads']:,}**\n"
              f"- Batch records mapped: **{report['batch_mapped_leads']:,}**\n"
              f"- Batch records still unmapped: **{report['batch_unmapped_leads']:,}**\n"
              f"- Collisions: **{report['collisions']}**\n"
              f"- Quarantined: **{report['quarantined']}**\n"
              f"- Batch: `{report['batch_id']}`\n"
          )
          request_json(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments',
              method='POST',
              data={'body': comment_body},
              headers={'Authorization': f'Bearer {gh_token}'},
          )
          PY

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotio-two-file-production-recovery
          path: /tmp/spotio-recovery-result.json
          if-no-files-found: warn
          retention-days: 14
