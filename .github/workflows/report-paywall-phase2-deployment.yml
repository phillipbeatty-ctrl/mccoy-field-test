name: Report Field Coach Paywall Phase 2 Deployment

on:
  workflow_run:
    workflows: ['Deploy Field Coach Paywall Phase 2']
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.event.workflow_run.event == 'issue_comment' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment result on issue 105
        uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run;
            const passed=run.conclusion==='success';
            const body=[
              `## Paywall Phase 2 production deployment ${passed?'completed':'stopped'}`,
              '',
              `- Conclusion: \`${run.conclusion}\``,
              `- Commit: \`${run.head_sha}\``,
              `- Workflow run: ${run.html_url}`,
              '',
              passed
                ? 'The protected Edge Function deployment workflow completed its source validation and production deployment sequence. Review the attached non-secret evidence artifact before closing Phase 2.'
                : 'The guarded workflow stopped without reporting a successful complete deployment. Inspect the failed step before retrying; do not treat this as a partial success.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:105,
              body
            });
