name: Field Coach Android Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/capacitor-native-location
    paths:
      - 'mobile/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/mobile-android-dev.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/mobile-android-dev.yml'

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: node --test mobile/native-location.test.mjs
      - run: npm run mobile:add:android
      - name: Verify production application ID
        working-directory: android
        run: grep -R -q 'com.mccoy.fieldcoach' app
      - name: Build installable Android release-candidate APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: field-coach-android-release-candidate-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
