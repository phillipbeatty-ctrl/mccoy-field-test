name: Materialize approved Field Coach logo source

on:
  workflow_dispatch:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.github/workflows/materialize-approved-field-coach-logo.yml'

permissions:
  contents: write

concurrency:
  group: approved-field-coach-logo-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-approved-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the correction branch and repository history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install the pinned image library
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Recover only the checksum-matching approved upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import re
          import subprocess
          from pathlib import Path

          from PIL import Image, ImageChops

          root = Path.cwd()
          brand = root / 'assets' / 'brand'
          brand.mkdir(parents=True, exist_ok=True)

          historical_commit = '7d93fa2fb628a4d2c08cb6e2674334c23080e272'
          expected_jpeg_sha256 = '227203e1c0ab14a1aa400e6f0d1411a6512222a685589df92dac3f3c1633cd90'
          expected_png_sha256 = 'ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5'

          svg = subprocess.check_output(
              ['git', 'show', f'{historical_commit}:assets/logo.svg'],
              cwd=root,
          )
          matches = re.findall(
              rb'data:image/(?:jpeg|jpg);base64,([^"\']+)',
              svg,
              flags=re.IGNORECASE,
          )
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one embedded JPEG in historical evidence; found {len(matches)}')

          encoded = re.sub(rb'\s+', b'', matches[0])
          original_bytes = base64.b64decode(encoded, validate=True)
          original_sha256 = hashlib.sha256(original_bytes).hexdigest()
          if original_sha256 != expected_jpeg_sha256:
              raise SystemExit(
                  'Historical embedded JPEG does not equal the newly approved upload: '
                  f'expected {expected_jpeg_sha256}, received {original_sha256}'
              )

          original_path = brand / 'approved-upload-original.jpg'
          original_path.write_bytes(original_bytes)

          with Image.open(io.BytesIO(original_bytes)) as source:
              source.load()
              approved_rgb = source.convert('RGB')
              if approved_rgb.size != (1024, 1024):
                  raise SystemExit(f'Approved upload must remain 1024x1024; received {approved_rgb.size}')
              png_path = brand / 'official-logo-source.png'
              approved_rgb.save(png_path, format='PNG', optimize=True, compress_level=9)

          png_bytes = png_path.read_bytes()
          png_sha256 = hashlib.sha256(png_bytes).hexdigest()
          if png_sha256 != expected_png_sha256:
              raise SystemExit(
                  'Normalized approved PNG is not byte-identical to the reviewed conversion: '
                  f'expected {expected_png_sha256}, received {png_sha256}'
              )

          with Image.open(original_path) as original, Image.open(png_path) as normalized:
              original_rgb = original.convert('RGB')
              normalized_rgb = normalized.convert('RGB')
              if original_rgb.size != normalized_rgb.size:
                  raise SystemExit('Approved JPEG and normalized PNG dimensions differ')
              if ImageChops.difference(original_rgb, normalized_rgb).getbbox() is not None:
                  raise SystemExit('Approved JPEG and normalized PNG decoded pixels differ')

          (brand / 'official-logo-source.sha256').write_text(
              f'{png_sha256}  assets/brand/official-logo-source.png\n',
              encoding='utf-8',
          )
          print({
              'approved_upload_sha256': original_sha256,
              'normalized_png_sha256': png_sha256,
              'dimensions': [1024, 1024],
              'pixel_identical': True,
          })
          PY

      - name: Commit the immutable approved source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git add assets/brand/approved-upload-original.jpg \
                  assets/brand/official-logo-source.png \
                  assets/brand/official-logo-source.sha256
          if git diff --cached --quiet; then
            echo 'Approved source files are already current.'
            exit 0
          fi
          git commit -m 'Materialize checksum-verified approved logo source [approved-logo-source]'
          git push origin HEAD:${GITHUB_REF_NAME}
