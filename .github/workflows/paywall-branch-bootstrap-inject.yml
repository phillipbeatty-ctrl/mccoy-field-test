name: Paywall branch bootstrap injection

on:
  push:
    branches:
      - fix/organization-paywall-gate-v2-20260901
    paths:
      - 'app-organization-access-gate.js'
      - '.github/workflows/paywall-branch-bootstrap-inject.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/organization-paywall-gate-v2-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the organization gate before dependent feature listeners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          marker='<script src="app-organization-access-gate.js?v=2026090101"></script>'
          if marker not in text:
              needle='<script src="app-auth.js"></script>'
              if needle not in text:
                  raise SystemExit('app-auth script marker not found')
              text=text.replace(needle,needle+marker,1)
              path.write_text(text,encoding='utf-8')
          PY
          node --check app-organization-access-gate.js
      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/paywall-branch-bootstrap-inject.yml
      - name: Commit deterministic bootstrap update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-organization-access-gate.js .github/workflows/paywall-branch-bootstrap-inject.yml
          if git diff --cached --quiet; then
            echo 'No bootstrap change required.'
            exit 0
          fi
          git commit -m 'Load organization access gate before feature modules'
          git push origin HEAD:fix/organization-paywall-gate-v2-20260901
