name: Materialize approved Field Coach logo source v3

on:
  workflow_dispatch:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.github/workflows/materialize-approved-field-coach-logo-v3.yml'

permissions:
  contents: write

concurrency:
  group: approved-field-coach-logo-source-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-approved-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out correction branch and repository history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install pinned image library with system Python
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Recover only bytes equal to the approved upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import re
          import subprocess
          from pathlib import Path

          from PIL import Image, ImageChops

          root = Path.cwd()
          brand = root / "assets" / "brand"
          brand.mkdir(parents=True, exist_ok=True)
          historical_commit = "7d93fa2fb628a4d2c08cb6e2674334c23080e272"
          expected_jpeg = "227203e1c0ab14a1aa400e6f0d1411a6512222a685589df92dac3f3c1633cd90"
          expected_png = "ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5"

          svg = subprocess.check_output(
              ["git", "show", f"{historical_commit}:assets/logo.svg"],
              cwd=root,
          )
          matches = re.findall(
              rb"data:image/(?:jpeg|jpg);base64,([^\"']+)",
              svg,
              flags=re.IGNORECASE,
          )
          if len(matches) != 1:
              raise SystemExit(f"Expected one embedded JPEG; found {len(matches)}")

          original_bytes = base64.b64decode(
              re.sub(rb"\s+", b"", matches[0]),
              validate=True,
          )
          jpeg_digest = hashlib.sha256(original_bytes).hexdigest()
          if jpeg_digest != expected_jpeg:
              raise SystemExit(
                  "Historical recovery bytes do not equal the newly approved upload: "
                  f"expected {expected_jpeg}, received {jpeg_digest}"
              )

          original_path = brand / "approved-upload-original.jpg"
          source_path = brand / "official-logo-source.png"
          original_path.write_bytes(original_bytes)
          with Image.open(io.BytesIO(original_bytes)) as image:
              image.load()
              source = image.convert("RGB")
              if source.size != (1024, 1024):
                  raise SystemExit(f"Approved upload dimensions changed: {source.size}")
              source.save(source_path, format="PNG", optimize=True, compress_level=9)

          png_digest = hashlib.sha256(source_path.read_bytes()).hexdigest()
          if png_digest != expected_png:
              raise SystemExit(
                  "Normalized PNG does not equal the reviewed conversion: "
                  f"expected {expected_png}, received {png_digest}"
              )

          with Image.open(original_path) as original, Image.open(source_path) as normalized:
              original_rgb = original.convert("RGB")
              normalized_rgb = normalized.convert("RGB")
              if original_rgb.size != normalized_rgb.size:
                  raise SystemExit("Approved source dimensions differ")
              if ImageChops.difference(original_rgb, normalized_rgb).getbbox() is not None:
                  raise SystemExit("Approved source decoded pixels differ")

          (brand / "official-logo-source.sha256").write_text(
              f"{png_digest}  assets/brand/official-logo-source.png\n",
              encoding="utf-8",
          )
          print({
              "approved_upload_sha256": jpeg_digest,
              "normalized_png_sha256": png_digest,
              "dimensions": [1024, 1024],
              "pixel_identical": True,
          })
          PY

      - name: Commit immutable source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Field Coach Release Bot'
          git config user.email 'phillip.beatty@gmail.com'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add assets/brand/approved-upload-original.jpg \
                  assets/brand/official-logo-source.png \
                  assets/brand/official-logo-source.sha256
          if git diff --cached --quiet; then
            echo 'Approved source files are already current.'
            exit 0
          fi
          git commit -m 'Materialize checksum-verified approved logo source [approved-logo-source]'
          git push origin HEAD:${GITHUB_REF_NAME}
