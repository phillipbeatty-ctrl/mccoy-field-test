name: Finalize approved Field Coach beta 4

on:
  workflow_dispatch:
  push:
    branches:
      - fix/approved-official-logo-beta4-20260901
    paths:
      - '.github/workflows/finalize-approved-field-coach-beta4.yml'
      - 'downloads/Field-Coach-Android-1.0.0-beta.4-debug.apk'
      - 'downloads/Field-Coach-Android-1.0.0-beta.4-debug.apk.sha256'

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: finalize-approved-field-coach-beta4
  cancel-in-progress: true

jobs:
  validate-promote-and-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BRANCH: fix/approved-official-logo-beta4-20260901
      EXPECTED_JPEG_SHA256: 227203e1c0ab14a1aa400e6f0d1411a6512222a685589df92dac3f3c1633cd90
      EXPECTED_PNG_SHA256: ca00cdb16a50d463f9add9c15c4d193b038143f5e2b1cc4b86b9bc8cd4d787f5
      APP_VERSION: 1.0.0-beta.4
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned logo verification dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Wait for the verified beta 4 package commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target=''
          for attempt in $(seq 1 240); do
            git fetch --quiet origin "${BRANCH}"
            candidate="$(git rev-parse "origin/${BRANCH}")"
            message="$(git show -s --format=%B "$candidate")"
            if grep -Fq '[android-beta4-generated]' <<<"$message" \
              && git cat-file -e "$candidate:downloads/Field-Coach-Android-${APP_VERSION}-debug.apk" \
              && git cat-file -e "$candidate:downloads/Field-Coach-Android-${APP_VERSION}-debug.apk.sha256"; then
              target="$candidate"
              break
            fi
            echo "Waiting for the beta 4 generated package commit (${attempt}/240)."
            sleep 10
          done
          test -n "$target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Validated target candidate: $target"

      - name: Check out the exact generated target
        run: git checkout --detach '${{ steps.target.outputs.sha }}'

      - name: Verify immutable approved source and deterministic derivatives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-approved-logo-source.py
          python3 scripts/apply-field-coach-icon-links.py
          git diff --exit-code -- '*.html'
          python3 scripts/generate-field-coach-icons.py
          git diff --exit-code -- assets/favicon-64.png \
            assets/apple-touch-icon-180.png \
            assets/icon-192.png \
            assets/icon-512.png \
            assets/icon-maskable-512.png \
            assets/icon-only.png \
            assets/icon-foreground.png \
            assets/icon-background.png \
            assets/splash.png
          node scripts/verify-png-content.mjs \
            assets/favicon-64.png \
            assets/apple-touch-icon-180.png \
            assets/icon-192.png \
            assets/icon-512.png \
            assets/icon-maskable-512.png \
            assets/icon-only.png \
            assets/icon-foreground.png
          test "$(sha256sum assets/brand/approved-upload-original.jpg | awk '{print $1}')" = "$EXPECTED_JPEG_SHA256"
          test "$(sha256sum assets/brand/official-logo-source.png | awk '{print $1}')" = "$EXPECTED_PNG_SHA256"

      - name: Verify runtime references, versions, tests, and APK checksum
        shell: bash
        run: |
          set -euo pipefail
          if grep -nH '/assets/logo\.svg' ./*.html ./*.js; then
            echo 'A runtime surface still references the deprecated vector source.' >&2
            exit 1
          fi
          grep -Fq '/assets/brand/official-logo-source.png' index.html
          grep -Fq '/assets/brand/official-logo-source.png' app-product-brand.js
          grep -Fq 'field-coach-app-shell-v5-20260901-beta4-approved-logo' service-worker.js
          test "$(cat VERSION)" = '1.0.0-beta.4+4'
          test "$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" = "$APP_VERSION"
          sha256sum -c "downloads/Field-Coach-Android-${APP_VERSION}-debug.apk.sha256"
          node --test \
            mobile-release.test.mjs \
            webapp-download.test.mjs \
            app-update-recovery.test.mjs \
            webapp-csp-install.test.mjs

      - name: Require a successful beta 4 Android workflow on an ancestor
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.target.outputs.sha }}'
          found='false'
          for attempt in $(seq 1 120); do
            runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&event=push&per_page=100")"
            while read -r run_sha; do
              test -n "$run_sha" || continue
              git fetch --quiet origin "$run_sha" || true
              if git merge-base --is-ancestor "$run_sha" "$target" \
                && git show "$run_sha:.github/workflows/field-coach-android-internal.yml" 2>/dev/null | grep -Fq 'APP_VERSION: 1.0.0-beta.4'; then
                found='true'
                break
              fi
            done < <(jq -r '.workflow_runs[] | select(.name=="Field Coach Android Internal Beta" and .status=="completed" and .conclusion=="success") | .head_sha' <<<"$runs")
            if test "$found" = 'true'; then break; fi
            echo "Waiting for successful beta 4 Android workflow (${attempt}/120)."
            sleep 10
          done
          test "$found" = 'true'

      - name: Require successful Vercel preview status on the exact target
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.target.outputs.sha }}'
          for attempt in $(seq 1 120); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}/status")"
            state="$(jq -r '[.statuses[] | select(.context=="Vercel")][0].state // "pending"' <<<"$status")"
            if test "$state" = 'success'; then
              echo 'Vercel preview is ready on the exact target.'
              exit 0
            fi
            if test "$state" = 'failure' || test "$state" = 'error'; then
              echo "Vercel preview failed with state: $state" >&2
              exit 1
            fi
            echo "Waiting for Vercel preview (${attempt}/120): $state"
            sleep 10
          done
          echo 'Timed out waiting for Vercel preview.' >&2
          exit 1

      - name: Merge only the validated target head
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.target.outputs.sha }}'
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number,headRefOid --limit 1)"
          pr_number="$(jq -r '.[0].number // empty' <<<"$pr_json")"
          pr_head="$(jq -r '.[0].headRefOid // empty' <<<"$pr_json")"
          test -n "$pr_number"
          test "$pr_head" = "$target"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$target"
          gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body "Approved-logo beta 4 final validation passed on \`$target\`: exact source hashes and pixels, deterministic derivatives, runtime references, repository tests, APK checksum, successful Android workflow, and Vercel preview. Merging only this validated head."
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$target" \
            --subject 'Lock approved Field Coach logo and publish Android beta 4' \
            --body 'Use the exact owner-approved upload as the immutable Field Coach logo source, publish deterministic browser/PWA/native derivatives, and advance the controlled Android build to 1.0.0-beta.4.'
          merge_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge_sha"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Confirm production serves the exact approved beta 4 assets
        shell: bash
        run: |
          set -euo pipefail
          production='https://www.mccoyplatform.com'
          mkdir -p /tmp/field-coach-production
          for attempt in $(seq 1 120); do
            ready='true'
            curl -fsSL --retry 2 "$production/assets/brand/official-logo-source.png?beta4=$RANDOM" -o /tmp/field-coach-production/official-logo-source.png || ready='false'
            curl -fsSL --retry 2 "$production/assets/icon-512.png?beta4=$RANDOM" -o /tmp/field-coach-production/icon-512.png || ready='false'
            curl -fsSL --retry 2 "$production/assets/icon-maskable-512.png?beta4=$RANDOM" -o /tmp/field-coach-production/icon-maskable-512.png || ready='false'
            curl -fsSL --retry 2 "$production/service-worker.js?beta4=$RANDOM" -o /tmp/field-coach-production/service-worker.js || ready='false'
            curl -fsSL --retry 2 "$production/download.html?beta4=$RANDOM" -o /tmp/field-coach-production/download.html || ready='false'
            if test "$ready" = 'true' \
              && cmp -s assets/brand/official-logo-source.png /tmp/field-coach-production/official-logo-source.png \
              && cmp -s assets/icon-512.png /tmp/field-coach-production/icon-512.png \
              && cmp -s assets/icon-maskable-512.png /tmp/field-coach-production/icon-maskable-512.png \
              && grep -Fq 'field-coach-app-shell-v5-20260901-beta4-approved-logo' /tmp/field-coach-production/service-worker.js \
              && grep -Fq 'Field-Coach-Android-1.0.0-beta.4-debug.apk' /tmp/field-coach-production/download.html; then
              echo 'Production serves the exact approved source, matching derivatives, beta 4 app shell, and beta 4 download link.'
              gh pr comment '${{ steps.merge.outputs.pr }}' --repo "$GITHUB_REPOSITORY" --body "Production verification passed for merge \`${{ steps.merge.outputs.sha }}\`: the approved source PNG and key derivatives match the validated branch byte-for-byte, the beta 4 service-worker identity is live, and the beta 4 Android download link is published."
              exit 0
            fi
            echo "Waiting for production beta 4 propagation (${attempt}/120)."
            sleep 10
          done
          echo 'Production did not converge to the validated beta 4 assets within the verification window.' >&2
          exit 1
